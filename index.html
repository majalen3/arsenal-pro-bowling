<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbanek Honey Badgers — Arsenal Pro</title>
<style>
  :root { --bg:#070b14; --card:#121826; --gold:#DAAF37; --green:#0F4D34; --text:#eef4ff; --muted:#9bb0d0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(90deg,#0F4D34,#0a1528); padding:0.7rem 1.1rem; border-bottom:2px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.3rem; color:var(--gold); font-weight:800; }
  .slogan { font-size:0.62rem; color:var(--gold); opacity:0.85; }
  .container { display:flex; flex:1; overflow:hidden; }
  .sidebar { width:280px; background:var(--card); border-right:1px solid #1f2a40; overflow-y:auto; padding:0.6rem; }
  .sidebar h2 { font-size:0.9rem; color:var(--gold); margin-bottom:0.4rem; }
  .ball-card { background:#1a2236; border:1px solid #2a3550; border-radius:8px; padding:0.45rem 0.5rem; margin-bottom:0.35rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem; position:relative; }
  .ball-card.active { border-color:var(--gold); }
  .ball-dot { width:32px; height:32px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.55rem; font-weight:800; color:#000; }
  .ball-card .name { font-weight:600; font-size:0.84rem; }
  .ball-card .meta { font-size:0.58rem; color:var(--muted); }
  .info-btn { position:absolute; right:5px; top:5px; background:#2a3550; color:var(--gold); border:none; border-radius:3px; padding:1px 4px; font-size:0.6rem; cursor:pointer; }
  .main { flex:1; display:flex; flex-direction:column; padding:0.6rem; }
  .controls { display:flex; gap:0.45rem; flex-wrap:wrap; background:var(--card); padding:0.6rem; border-radius:8px; margin-bottom:0.45rem; }
  .control-group { display:flex; flex-direction:column; min-width:88px; flex:1; }
  .control-group label { font-size:0.58rem; color:var(--muted); margin-bottom:1px; }
  input, select { background:#0d1320; border:1px solid #2a3550; color:var(--text); padding:0.22rem; border-radius:4px; font-size:0.78rem; }
  button { background:var(--gold); color:#000; border:none; padding:0.32rem 0.65rem; border-radius:5px; font-weight:700; cursor:pointer; font-size:0.78rem; }
  button.secondary { background:#2a3550; color:var(--text); }
  .canvas-wrap { flex:1; background:#0d1320; border-radius:8px; display:flex; align-items:center; justify-content:center; min-height:540px; position:relative; }
  canvas { max-width:100%; max-height:100%; border-radius:4px; }
  .info-panel { background:var(--card); margin-top:0.45rem; padding:0.6rem; border-radius:8px; font-size:0.78rem; line-height:1.4; }
  .strike-banner { position:absolute; top:8px; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; font-weight:800; padding:0.3rem 1rem; border-radius:18px; font-size:0.95rem; display:none; }
  .strike-banner.show { display:block; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:100; align-items:center; justify-content:center; padding:1rem; }
  .modal.open { display:flex; }
  .modal-content { background:var(--card); border:1px solid var(--gold); border-radius:12px; width:min(640px,95vw); max-height:90vh; overflow-y:auto; padding:1.2rem; }
  .modal-content h2 { color:var(--gold); }
  .modal-content .close { float:right; cursor:pointer; font-size:1.5rem; }
  .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.45rem; margin:0.7rem 0; }
  .spec-item { background:#1a2236; padding:0.45rem; border-radius:5px; font-size:0.82rem; }
  .recommendation { background:#142a22; border-left:3px solid var(--gold); padding:0.7rem; margin-top:0.7rem; border-radius:5px; }
  .links a { color:var(--gold); }
  @media (max-width:880px) { .container{flex-direction:column;} .sidebar{width:100%; max-height:160px;} }
</style>
</head>
<body>
<header>
  <div><h1>URBANEK HONEY BADGERS</h1><div class="slogan">Fearless. Relentless. Always Hunting Strikes.</div></div>
  <div style="font-size:0.72rem;background:#000;padding:0.25rem 0.6rem;border-radius:14px;border:1px solid var(--gold);">Arsenal Pro</div>
</header>
<div class="container">
  <aside class="sidebar">
    <h2>Arsenal</h2>
    <div id="ballList"></div>
  </aside>
  <main class="main">
    <div class="controls">
      <div class="control-group"><label>Speed</label><input type="range" id="speed" min="12" max="22" value="15" step="0.5"><span id="speedVal">15</span></div>
      <div class="control-group"><label>Rev</label><input type="range" id="rev" min="100" max="500" value="220" step="10"><span id="revVal">220</span></div>
      <div class="control-group"><label>Release Board</label><input type="range" id="release" min="5" max="30" value="15" step="1"><span id="releaseVal">15</span></div>
      <div class="control-group"><label>Aim °</label><input type="range" id="aim" min="-8" max="8" value="0" step="0.5"><span id="aimVal">0</span></div>
      <div class="control-group"><label>Oil</label><input type="range" id="oil" min="0.6" max="1.5" value="1" step="0.1"><span id="oilVal">1.0</span></div>
      <div class="control-group"><label>Finish</label>
        <select id="finish"><option value="factory">Factory</option><option value="500">500 grit</option><option value="1000">1000</option><option value="2000">2000</option><option value="3000">3000</option><option value="polished">Polished</option></select>
      </div>
      <div class="control-group"><label>Pattern</label>
        <select id="pattern"><option value="house">House</option><option value="sport">Sport</option><option value="cheetah">Cheetah</option><option value="scorpion">Scorpion</option><option value="shark">Shark</option><option value="dry">Dry</option></select>
      </div>
      <button id="simulate">Simulate</button>
      <button class="secondary" id="recommend">Recommended</button>
    </div>
    <div class="canvas-wrap">
      <div class="strike-banner" id="strikeBanner">STRIKE</div>
      <canvas id="lane" width="340" height="820"></canvas>
    </div>
    <div class="info-panel" id="infoPanel">Board 1 is on the right (right-hander view). Ball hooks left toward the pocket.</div>
  </main>
</div>
<div class="modal" id="dossierModal"><div class="modal-content"><span class="close">&times;</span><div id="dossierContent"></div></div></div>
<script>
const balls = [
  {id:'rattler-big-bite', brand:'Radical', name:'Rattler Big Bite', color:'#DAAF37', rg:2.480, diff:0.035, cover:'Hybrid Reactive', coverName:'S.H.A.R.P. Hybrid', core:'Symmetric', coreName:'Rattler', finish:'500/1500/3000 Siaair', year:2024, motion:'Stronger mid-lane read with continuous motion.', rec:'YOUR PRIMARY HOUSE-SHOT BENCHMARK.', when:'Fresh to medium house.', whenNot:'Very dry lanes.', link:'https://www.bowwwl.com/bowling-balls/radical-rattler-big-bite'},
  {id:'deadly-rattler', brand:'Radical', name:'Deadly Rattler', color:'#00d4ff', rg:2.480, diff:0.035, cover:'Pearl Reactive', coverName:'HK22 HyperKinetic Pearl', core:'Symmetric', coreName:'Rattler', finish:'500/1000/1500 Crown', year:2023, motion:'Cleaner through the fronts, sharper backend.', rec:'YOUR TRANSITION BALL.', when:'Medium to light oil.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/radical-deadly-rattler'},
  {id:'super-nova', brand:'Storm', name:'Super Nova', color:'#ff6b35', rg:2.490, diff:0.052, cover:'Solid Reactive', coverName:'NeX Solid', core:'Asymmetric', coreName:'Ignition', finish:'2000 Abralon', year:2022, motion:'Very early reading, strong midlane.', rec:'Heavy oil or early traction.', when:'Fresh heavy house.', whenNot:'Medium or light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-super-nova'},
  {id:'hy-road', brand:'Storm', name:'Original Hy-Road', color:'#4ade80', rg:2.570, diff:0.046, cover:'Hybrid Reactive', coverName:'R2S Hybrid', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500-grit Polished', year:2008, motion:'Classic length with strong backend.', rec:'Excellent all-around.', when:'Medium house.', whenNot:'Very heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road'},
  {id:'hy-road-pearl', brand:'Storm', name:'Hy-Road Pearl', color:'#a78bfa', rg:2.570, diff:0.046, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500 Polished', year:2010, motion:'Clean then strong angular backend.', rec:'Ideal transition or lighter oil.', when:'Medium-light oil.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-pearl'},
  {id:'hy-road-solid', brand:'Storm', name:'Hy-Road Solid', color:'#22d3ee', rg:2.570, diff:0.046, cover:'Solid Reactive', coverName:'R2S Solid', core:'Symmetric', coreName:'Inverted Fe2', finish:'2000 Abralon', year:2014, motion:'Earlier than original with controlled midlane.', rec:'Stronger than the pearls.', when:'Fresh to medium house.', whenNot:'Light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-solid'},
  {id:'astrophysix', brand:'Storm', name:'AstroPhysiX', color:'#f472b6', rg:2.480, diff:0.053, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Asymmetric', coreName:'Atomic', finish:'1500 Polished', year:2019, motion:'Length then sharp backend.', rec:'Power pearl for angle.', when:'Medium oil when you need length.', whenNot:'Heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-astrophysix'},
  {id:'ice-storm', brand:'Storm', name:'Ice Storm', color:'#67e8f9', rg:2.550, diff:0.040, cover:'Pearl Reactive', core:'Symmetric', finish:'Polished', year:2015, motion:'Cleaner, controllable pearl.', rec:'Dry lanes.', when:'Dry or broken-down.', whenNot:'Fresh oil.'},
  {id:'innovator', brand:'Radical', name:'Innovator', color:'#fb7185', rg:2.470, diff:0.050, cover:'Solid Reactive', core:'Asymmetric', year:2020, motion:'Strong early-to-mid solid.', rec:'Heavy oil control.', when:'Fresh heavy.', whenNot:'Medium or light.'},
  {id:'bigfoot-hybrid', brand:'Radical', name:'Bigfoot Hybrid', color:'#fbbf24', rg:2.468, diff:0.053, cover:'Hybrid Reactive', coverName:'HK22 Hybrid', core:'Symmetric', coreName:'Bigfoot', year:2022, motion:'Strong continuous hybrid.', rec:'Benchmark hybrid.', when:'Medium-heavy.', whenNot:'Light oil.'},
  {id:'rattler', brand:'Radical', name:'Rattler', color:'#86efac', rg:2.480, diff:0.035, cover:'Solid Reactive', coverName:'S.H.A.R.P', core:'Symmetric', coreName:'Rattler', finish:'500/1500/4000', year:2023, motion:'Benchmark solid — continuous.', rec:'Reliable control.', when:'Smooth control needed.', whenNot:'When you need more angle.'},
  {id:'ordnance-c4', brand:'900 Global', name:'Ordnance C4', color:'#c084fc', rg:2.490, diff:0.041, cover:'Hybrid Reactive', coverName:'S70 Hybrid', core:'Symmetric', coreName:'Shrapnel 2.0', finish:'4000 Abralon', year:2020, motion:'Clean hybrid.', rec:'Versatile medium-oil.', when:'Medium conditions.', whenNot:'Extremes.'},
  {id:'raw-hammer', brand:'Hammer', name:'Raw Hammer Black', color:'#94a3b8', rg:2.540, diff:0.038, cover:'Solid Reactive', core:'Symmetric', year:2021, motion:'Controlled solid.', rec:'Benchmark solid.', when:'Standard house.', whenNot:'Very light oil.'},
  {id:'rack-attack', brand:'Sports Tec', name:'Rack Attack Pro Line Urethane', color:'#f97316', rg:2.600, diff:0.015, cover:'Urethane', core:'Symmetric', year:2020, motion:'Classic urethane — smooth early roll.', rec:'Short patterns or dry.', when:'Short or dry.', whenNot:'Heavy oil.'}
];
let selectedBall = balls[0];
let canvas, ctx;

function getFinishMod(f) {
  if (f==='500') return {e:1.25,h:1.15};
  if (f==='1000') return {e:1.12,h:1.08};
  if (f==='2000') return {e:1.0,h:1.0};
  if (f==='3000') return {e:0.88,h:0.95};
  if (f==='polished') return {e:0.72,h:0.88};
  return {e:1.0,h:1.0};
}
function getCoverMod(c) {
  if (c.includes('Solid')) return {e:0.75,h:1.15};
  if (c.includes('Pearl')) return {e:0.30,h:0.95};
  if (c.includes('Hybrid')) return {e:0.52,h:1.05};
  if (c.includes('Urethane')) return {e:0.85,h:0.65};
  return {e:0.5,h:1.0};
}
function openDossier(ball) {
  document.getElementById('dossierContent').innerHTML = `
    <h2>${ball.brand} ${ball.name}</h2>
    <div style="color:var(--muted);font-size:0.82rem;margin-bottom:0.5rem;">${ball.year||''} • ${ball.cover}${ball.coverName?' ('+ball.coverName+')':''}</div>
    <div class="spec-grid">
      <div class="spec-item"><strong>RG</strong><br>${ball.rg}</div>
      <div class="spec-item"><strong>Diff</strong><br>${ball.diff}</div>
      <div class="spec-item"><strong>Core</strong><br>${ball.core}${ball.coreName?' • '+ball.coreName:''}</div>
      <div class="spec-item"><strong>Factory Finish</strong><br>${ball.finish||'—'}</div>
    </div>
    <p><strong>Motion:</strong> ${ball.motion}</p>
    <div class="recommendation">
      <strong>Recommendation for ~15 mph / ~220 RPM</strong><br>${ball.rec}<br><br>
      <strong>When to use:</strong> ${ball.when}<br>
      <strong>When to leave it in the bag:</strong> ${ball.whenNot}
    </div>
    ${ball.link?`<div class="links"><a href="${ball.link}" target="_blank">View on bowwwl.com →</a></div>`:''}
  `;
  document.getElementById('dossierModal').classList.add('open');
}
function init() {
  const list = document.getElementById('ballList');
  balls.forEach(b => {
    const card = document.createElement('div');
    card.className = 'ball-card'+(b.id===selectedBall.id?' active':'');
    card.innerHTML = `<div class="ball-dot" style="background:${b.color}">${b.brand[0]}</div><div><div class="name">${b.name}</div><div class="meta">${b.cover.split(' ')[0]} • RG ${b.rg}</div></div><button class="info-btn">Info</button>`;
    card.onclick = e => { if(e.target.classList.contains('info-btn')) return; selectedBall=b; document.querySelectorAll('.ball-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); drawLane(); };
    card.querySelector('.info-btn').onclick = e => { e.stopPropagation(); openDossier(b); };
    list.appendChild(card);
  });
  ['speed','rev','release','aim','oil'].forEach(id => document.getElementById(id).oninput = e => document.getElementById(id+'Val').textContent = e.target.value);
  document.getElementById('finish').onchange = drawLane;
  document.getElementById('pattern').onchange = drawLane;
  document.getElementById('simulate').onclick = drawLane;
  document.getElementById('recommend').onclick = () => {
    const p = document.getElementById('pattern').value;
    const cover = getCoverMod(selectedBall.cover);
    let rel = cover.e > 0.6 ? 12 : 16;
    if (p==='cheetah'||p==='dry') rel = 18;
    if (p==='shark') rel = 10;
    document.getElementById('release').value = rel;
    document.getElementById('releaseVal').textContent = rel;
    drawLane();
  };
  document.querySelector('.close').onclick = () => document.getElementById('dossierModal').classList.remove('open');
  document.getElementById('dossierModal').onclick = e => { if(e.target.id==='dossierModal') e.target.classList.remove('open'); };
  canvas = document.getElementById('lane');
  ctx = canvas.getContext('2d');
  drawLane();
}

function boardToX(board, w) {
  return 25 + ((39 - board) / 39) * (w - 50);
}

function simulatePath(ball) {
  const speed = +document.getElementById('speed').value;
  const rev = +document.getElementById('rev').value;
  const release = +document.getElementById('release').value;
  const aim = +document.getElementById('aim').value;
  const oil = +document.getElementById('oil').value;
  const finish = document.getElementById('finish').value;
  const pattern = document.getElementById('pattern').value;
  const w = canvas.width, h = canvas.height;

  const cover = getCoverMod(ball.cover);
  const fin = getFinishMod(finish);
  const rgEarly = Math.max(0.2, Math.min(0.9, (2.60-ball.rg)*2.2));
  const diffHook = 0.7 + ball.diff*12;
  const asym = ball.core==='Asymmetric' ? 1.12 : 1.0;
  const early = (cover.e*0.5 + rgEarly*0.35 + fin.e*0.15) * fin.e;
  const hookPot = cover.h * diffHook * asym * fin.h;
  const revRatio = rev / (speed*14);
  const baseHook = hookPot * (0.55 + revRatio*0.45) / oil;

  let x = boardToX(release, w);
  let y = h - 55;
  let vx = Math.sin(aim * Math.PI/180) * 0.9;
  let vy = -5.4;
  const points = [];
  let breakpoint = null;

  for (let t=0; t<240; t++) {
    points.push({x,y});
    const board = 39 - ((x-25)/(w-50))*39;
    let fr = 0.28;
    if (pattern==='house') fr = (board<8||board>31)?1.55 : (board>15&&board<24?0.22:0.6);
    else if (pattern==='cheetah') fr = 1.6;
    else if (pattern==='dry') fr = 1.8;
    else if (pattern==='shark') fr = 0.42;
    else fr = 0.58;
    fr *= oil;

    const prog = (h-55-y)/(h-130);
    const phaseStart = 0.40 - early*0.18;
    let phase = 0;
    if (prog > phaseStart) {
      const p = Math.min(1, (prog-phaseStart)/(1-phaseStart));
      phase = Math.pow(p, 1.5) * (1.05 - p*0.25);
    }
    const force = baseHook * fr * phase * 0.38;
    vx -= force * 0.11;
    if (prog > 0.80) vx *= 0.982;
    x += vx; y += vy;

    if (!breakpoint && phase>0.28 && force>0.04) breakpoint = {x,y,board};
    if (y < 65) break;
  }
  return {points, breakpoint};
}

function drawPins(w, h) {
  const baseY = 62;
  const spacing = 13.5;
  const centerX = boardToX(20, w);
  const pins = [
    {n:1,x:centerX,y:baseY},                          // head pin closest to bowler
    {n:2,x:centerX-spacing*0.82,y:baseY-spacing*0.85},
    {n:3,x:centerX+spacing*0.82,y:baseY-spacing*0.85},
    {n:4,x:centerX-spacing*1.64,y:baseY-spacing*1.7},
    {n:5,x:centerX,y:baseY-spacing*1.7},
    {n:6,x:centerX+spacing*1.64,y:baseY-spacing*1.7},
    {n:7,x:centerX-spacing*2.46,y:baseY-spacing*2.55}, // back row farthest
    {n:8,x:centerX-spacing*0.82,y:baseY-spacing*2.55},
    {n:9,x:centerX+spacing*0.82,y:baseY-spacing*2.55},
    {n:10,x:centerX+spacing*2.46,y:baseY-spacing*2.55}
  ];
  pins.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#222'; ctx.lineWidth=0.7; ctx.stroke();
    ctx.fillStyle='#000'; ctx.font='5.5px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.n, p.x, p.y+1.8);
  });
  ctx.strokeStyle='rgba(218,175,55,0.55)'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.arc(centerX+9, baseY-spacing*0.4, 15, 0, Math.PI*2); ctx.stroke();
}

function drawLane() {
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#1c4f36';
  ctx.fillRect(25, 35, w-50, h-80);

  ctx.strokeStyle='rgba(255,255,255,0.06)';
  ctx.font='6.5px sans-serif';
  ctx.fillStyle='rgba(255,255,255,0.5)';
  ctx.textAlign='center';
  for (let i=1; i<=39; i++) {
    const x = boardToX(i, w);
    ctx.beginPath(); ctx.moveTo(x,35); ctx.lineTo(x,h-45); ctx.stroke();
    if (i%5===0) ctx.fillText(i, x, h-32);
  }

  const arrowY = h*0.62;
  [5,10,15,20,25,30,35].forEach(b=>{
    const x = boardToX(b, w);
    ctx.fillStyle = b===20 ? '#f1c40f' : '#e74c3c';
    ctx.beginPath();
    ctx.moveTo(x, arrowY-4.5);
    ctx.lineTo(x-3.5, arrowY+3.5);
    ctx.lineTo(x+3.5, arrowY+3.5);
    ctx.closePath(); ctx.fill();
  });
  ctx.fillStyle='#fff'; ctx.font='6.5px sans-serif'; ctx.textAlign='left';
  ctx.fillText('ARROWS', 32, arrowY-8);

  const footY = h-22;
  ctx.fillStyle='#111';
  for (let i=5; i<=35; i+=5) {
    const x = boardToX(i, w);
    ctx.beginPath(); ctx.arc(x, footY, 2, 0, Math.PI*2); ctx.fill();
  }
  ctx.fillStyle='#fff'; ctx.font='6.5px sans-serif';
  ctx.fillText('FOOT', 32, footY+9);

  ctx.strokeStyle='#fff'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(25,h-45); ctx.lineTo(w-25,h-45); ctx.stroke();

  drawPins(w,h);

  const result = simulatePath(selectedBall);
  const pts = result.points;

  ctx.beginPath();
  ctx.strokeStyle = selectedBall.color;
  ctx.lineWidth = 2.8;
  pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.stroke();

  if (result.breakpoint) {
    ctx.fillStyle='#ff6b35';
    ctx.beginPath(); ctx.arc(result.breakpoint.x, result.breakpoint.y, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='6px sans-serif'; ctx.textAlign='center';
    ctx.fillText('BP', result.breakpoint.x, result.breakpoint.y-5);
  }
  if (pts.length) {
    const last=pts[pts.length-1];
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(last.x,last.y,4.5,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=selectedBall.color; ctx.stroke();
  }

  const endBoard = pts.length ? (39 - ((pts.at(-1).x-25)/(w-50))*39) : null;
  let pocketCall='—', isStrike=false;
  if (endBoard!==null) {
    if (endBoard>=17.5 && endBoard<=19.5) { pocketCall='FLUSH'; isStrike=true; }
    else if (endBoard>=16.5 && endBoard<17.5) { pocketCall='LIGHT'; isStrike=true; }
    else if (endBoard>19.5 && endBoard<=20.8) { pocketCall='HIGH'; isStrike=true; }
    else if (endBoard<16.5) pocketCall='LIGHT MISS';
    else pocketCall='HIGH MISS';
  }
  document.getElementById('strikeBanner').classList.toggle('show', isStrike);
  document.getElementById('strikeBanner').textContent = isStrike ? pocketCall : 'STRIKE';

  let entryAngle=null;
  if (pts.length>5) {
    const last=pts[pts.length-1], prev=pts[pts.length-4];
    entryAngle = Math.abs(Math.atan2(last.x-prev.x, last.y-prev.y)*180/Math.PI);
  }
  const finish = document.getElementById('finish').value;
  document.getElementById('infoPanel').innerHTML = `
    <strong>${selectedBall.brand} ${selectedBall.name}</strong> — Factory: ${selectedBall.finish||'—'}<br>
    Finish: <strong>${finish==='factory'?'Factory':finish}</strong> • Entry board: <strong>${endBoard?endBoard.toFixed(1):'—'}</strong> • Angle: <strong>${entryAngle?entryAngle.toFixed(1):'—'}°</strong><br>
    Pocket: <strong style="color:#DAAF37">${pocketCall}</strong><br>
    <span style="font-size:0.72rem;color:#9bb0d0">Head pin is closest to the bowler. Board 1 is on the right. Ball hooks left toward the pocket.</span>
  `;
}
init();
</script>
</body>
</html>
