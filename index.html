<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbanek Honey Badgers — Arsenal Pro</title>
<style>
  :root { --bg:#0a0e17; --surface:#141b28; --surface-2:#1c2538; --gold:#DAAF37; --green:#0F4D34; --text:#f1f5f9; --muted:#94a3b8; --border:#2a3548; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(90deg,var(--green),#0a1528); padding:0.85rem 1.25rem; border-bottom:2px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.35rem; color:var(--gold); font-weight:800; }
  .slogan { font-size:0.65rem; color:var(--gold); opacity:0.85; }
  .badge { font-size:0.72rem; background:#000; padding:0.3rem 0.7rem; border-radius:16px; border:1px solid var(--gold); }
  .container { display:flex; flex:1; overflow:hidden; min-height:0; }
  .sidebar { width:260px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; padding:0.75rem; flex-shrink:0; }
  .sidebar h2 { font-size:0.85rem; color:var(--gold); margin-bottom:0.5rem; font-weight:700; }
  .ball-card { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:0.55rem 0.6rem; margin-bottom:0.4rem; cursor:pointer; display:flex; align-items:center; gap:0.55rem; position:relative; }
  .ball-card.active { border-color:var(--gold); }
  .ball-dot { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.58rem; font-weight:800; color:#000; }
  .ball-card .name { font-weight:600; font-size:0.86rem; }
  .ball-card .meta { font-size:0.6rem; color:var(--muted); }
  .info-btn { position:absolute; right:6px; top:6px; background:#2a3548; color:var(--gold); border:none; border-radius:4px; padding:2px 6px; font-size:0.62rem; cursor:pointer; }
  .main { flex:1; display:flex; flex-direction:row; padding:0.6rem; gap:0.6rem; min-width:0; }
  .lane-area { flex:1; display:flex; flex-direction:column; gap:0.5rem; min-width:0; }
  .controls { width:190px; flex-shrink:0; display:flex; flex-direction:column; gap:0.35rem; background:var(--surface); padding:0.55rem; border-radius:10px; border:1px solid var(--border); overflow-y:auto; }
  .control-group { display:flex; flex-direction:column; }
  .control-group label { font-size:0.6rem; color:var(--muted); margin-bottom:2px; }
  input, select { background:#0d1320; border:1px solid var(--border); color:var(--text); padding:0.3rem 0.35rem; border-radius:6px; font-size:0.78rem; width:100%; }
  button { background:var(--gold); color:#000; border:none; padding:0.4rem 0.6rem; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.78rem; width:100%; margin-top:0.2rem; }
  button.secondary { background:#2a3548; color:var(--text); }
  .canvas-wrap { flex:1; background:var(--surface); border-radius:10px; display:flex; align-items:center; justify-content:center; min-height:480px; position:relative; border:1px solid var(--border); }
  canvas { max-width:100%; max-height:100%; }
  .info-panel { background:var(--surface); padding:0.65rem; border-radius:10px; font-size:0.78rem; line-height:1.45; border:1px solid var(--border); }
  .strike-banner { position:absolute; top:12px; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; font-weight:800; padding:0.35rem 1.1rem; border-radius:20px; font-size:0.95rem; display:none; }
  .strike-banner.show { display:block; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; align-items:center; justify-content:center; padding:1rem; }
  .modal.open { display:flex; }
  .modal-content { background:var(--surface); border:1px solid var(--gold); border-radius:14px; width:min(620px,95vw); max-height:90vh; overflow-y:auto; padding:1.4rem; }
  .modal-content h2 { color:var(--gold); }
  .modal-content .close { float:right; cursor:pointer; font-size:1.6rem; color:var(--muted); }
  .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin:0.8rem 0; }
  .spec-item { background:var(--surface-2); padding:0.55rem; border-radius:6px; }
  .recommendation { background:#122a22; border-left:3px solid var(--gold); padding:0.85rem; margin-top:0.8rem; border-radius:6px; }
  .links a { color:var(--gold); }
  @media (max-width:800px) {
    .container { flex-direction:column; }
    .sidebar { width:100%; max-height:130px; border-right:none; border-bottom:1px solid var(--border); }
    .main { flex-direction:column; padding:0.4rem; }
    .controls { width:100%; flex-direction:row; flex-wrap:wrap; gap:0.35rem; padding:0.4rem; }
    .control-group { min-width:46%; flex:1 1 46%; }
    button { width:auto; flex:1; }
    .canvas-wrap { min-height:360px; }
    canvas { width:100% !important; height:auto !important; max-height:65vh; }
  }
</style>
</head>
<body>
<header>
  <div><h1>URBANEK HONEY BADGERS</h1><div class="slogan">Fearless. Relentless. Always Hunting Strikes.</div></div>
  <div class="badge">Arsenal Pro</div>
</header>
<div class="container">
  <aside class="sidebar"><h2>ARSENAL</h2><div id="ballList"></div></aside>
  <main class="main">
    <div class="lane-area">
      <div class="canvas-wrap"><div class="strike-banner" id="strikeBanner">STRIKE</div><canvas id="lane" width="220" height="880"></canvas></div>
      <div class="info-panel" id="infoPanel">Head pin closest to bowler. Board 1 on right. Hooks left toward pocket.</div>
    </div>
    <div class="controls">
      <div class="control-group"><label>SPEED</label><input type="range" id="speed" min="12" max="22" value="15" step="0.5"><span id="speedVal">15</span></div>
      <div class="control-group"><label>REV</label><input type="range" id="rev" min="100" max="500" value="220" step="10"><span id="revVal">220</span></div>
      <div class="control-group"><label>RELEASE</label><input type="range" id="release" min="5" max="30" value="15" step="1"><span id="releaseVal">15</span></div>
      <div class="control-group"><label>AIM °</label><input type="range" id="aim" min="-8" max="8" value="0" step="0.5"><span id="aimVal">0</span></div>
      <div class="control-group"><label>OIL</label><input type="range" id="oil" min="0.6" max="1.5" value="1" step="0.1"><span id="oilVal">1.0</span></div>
      <div class="control-group"><label>FINISH</label><select id="finish"><option value="factory">Factory</option><option value="500">500</option><option value="1000">1000</option><option value="2000">2000</option><option value="3000">3000</option><option value="polished">Polished</option></select></div>
      <div class="control-group"><label>PATTERN</label><select id="pattern"><option value="house">House</option><option value="sport">Sport</option><option value="cheetah">Cheetah</option><option value="scorpion">Scorpion</option><option value="shark">Shark</option><option value="dry">Dry</option></select></div>
      <button id="simulate">Simulate</button>
      <button class="secondary" id="recommend">Recommended</button>
    </div>
  </main>
</div>
<div class="modal" id="dossierModal"><div class="modal-content"><span class="close">&times;</span><div id="dossierContent"></div></div></div>
<script>
const balls = [
  {id:'rattler-big-bite', brand:'Radical', name:'Rattler Big Bite', color:'#DAAF37', rg:2.480, diff:0.035, cover:'Hybrid Reactive', coverName:'S.H.A.R.P. Hybrid', core:'Symmetric', coreName:'Rattler', finish:'500/1500/3000 Siaair', year:2024, motion:'Stronger mid-lane read with continuous motion.', rec:'YOUR PRIMARY HOUSE-SHOT BENCHMARK.', when:'Fresh to medium house.', whenNot:'Very dry lanes.', link:'https://www.bowwwl.com/bowling-balls/radical-rattler-big-bite'},
  {id:'deadly-rattler', brand:'Radical', name:'Deadly Rattler', color:'#00d4ff', rg:2.480, diff:0.035, cover:'Pearl Reactive', coverName:'HK22 HyperKinetic Pearl', core:'Symmetric', coreName:'Rattler', finish:'500/1000/1500 Crown', year:2023, motion:'Cleaner through the fronts, sharper backend.', rec:'YOUR TRANSITION BALL.', when:'Medium to light oil.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/radical-deadly-rattler'},
  {id:'super-nova', brand:'Storm', name:'Super Nova', color:'#ff6b35', rg:2.490, diff:0.052, cover:'Solid Reactive', coverName:'NeX Solid', core:'Asymmetric', coreName:'Ignition', finish:'2000 Abralon', year:2022, motion:'Very early reading, strong midlane.', rec:'Heavy oil or early traction.', when:'Fresh heavy house.', whenNot:'Medium or light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-super-nova'},
  {id:'hy-road', brand:'Storm', name:'Original Hy-Road', color:'#4ade80', rg:2.570, diff:0.046, cover:'Hybrid Reactive', coverName:'R2S Hybrid', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500-grit Polished', year:2008, motion:'Classic length with strong backend.', rec:'Excellent all-around.', when:'Medium house.', whenNot:'Very heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road'},
  {id:'hy-road-pearl', brand:'Storm', name:'Hy-Road Pearl', color:'#a78bfa', rg:2.570, diff:0.046, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500 Polished', year:2010, motion:'Clean then strong angular backend.', rec:'Ideal transition or lighter oil.', when:'Medium-light oil.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-pearl'},
  {id:'hy-road-solid', brand:'Storm', name:'Hy-Road Solid', color:'#22d3ee', rg:2.570, diff:0.046, cover:'Solid Reactive', coverName:'R2S Solid', core:'Symmetric', coreName:'Inverted Fe2', finish:'2000 Abralon', year:2014, motion:'Earlier than original with controlled midlane.', rec:'Stronger than the pearls.', when:'Fresh to medium house.', whenNot:'Light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-solid'},
  {id:'astrophysix', brand:'Storm', name:'AstroPhysiX', color:'#f472b6', rg:2.480, diff:0.053, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Asymmetric', coreName:'Atomic', finish:'1500 Polished', year:2019, motion:'Length then sharp backend.', rec:'Power pearl for angle.', when:'Medium oil when you need length.', whenNot:'Heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-astrophysix'},
  {id:'ice-storm', brand:'Storm', name:'Ice Storm', color:'#67e8f9', rg:2.550, diff:0.040, cover:'Pearl Reactive', core:'Symmetric', finish:'Polished', year:2015, motion:'Cleaner, controllable pearl.', rec:'Dry lanes.', when:'Dry or broken-down.', whenNot:'Fresh oil.'},
  {id:'innovator', brand:'Radical', name:'Innovator', color:'#fb7185', rg:2.470, diff:0.050, cover:'Solid Reactive', core:'Asymmetric', year:2020, motion:'Strong early-to-mid solid.', rec:'Heavy oil control.', when:'Fresh heavy.', whenNot:'Medium or light.'},
  {id:'bigfoot-hybrid', brand:'Radical', name:'Bigfoot Hybrid', color:'#fbbf24', rg:2.468, diff:0.053, cover:'Hybrid Reactive', coverName:'HK22 Hybrid', core:'Symmetric', coreName:'Bigfoot', year:2022, motion:'Strong continuous hybrid.', rec:'Benchmark hybrid.', when:'Medium-heavy.', whenNot:'Light oil.'},
  {id:'rattler', brand:'Radical', name:'Rattler', color:'#86efac', rg:2.480, diff:0.035, cover:'Solid Reactive', coverName:'S.H.A.R.P', core:'Symmetric', coreName:'Rattler', finish:'500/1500/4000', year:2023, motion:'Benchmark solid — continuous.', rec:'Reliable control.', when:'Smooth control needed.', whenNot:'When you need more angle.'},
  {id:'ordnance-c4', brand:'900 Global', name:'Ordnance C4', color:'#c084fc', rg:2.490, diff:0.041, cover:'Hybrid Reactive', coverName:'S70 Hybrid', core:'Symmetric', coreName:'Shrapnel 2.0', finish:'4000 Abralon', year:2020, motion:'Clean hybrid.', rec:'Versatile medium-oil.', when:'Medium conditions.', whenNot:'Extremes.'},
  {id:'raw-hammer', brand:'Hammer', name:'Raw Hammer Black', color:'#94a3b8', rg:2.540, diff:0.038, cover:'Solid Reactive', core:'Symmetric', year:2021, motion:'Controlled solid.', rec:'Benchmark solid.', when:'Standard house.', whenNot:'Very light oil.'},
  {id:'rack-attack', brand:'Sports Tec', name:'Rack Attack Pro Line Urethane', color:'#f97316', rg:2.600, diff:0.015, cover:'Urethane', core:'Symmetric', year:2020, motion:'Classic urethane — smooth early roll.', rec:'Short patterns or dry.', when:'Short or dry.', whenNot:'Heavy oil.'}
];
let selectedBall = balls[0];
let canvas, ctx;

function getFinishMod(f) { if(f==='500')return{e:1.25,h:1.15}; if(f==='1000')return{e:1.12,h:1.08}; if(f==='2000')return{e:1,h:1}; if(f==='3000')return{e:0.88,h:0.95}; if(f==='polished')return{e:0.72,h:0.88}; return{e:1,h:1}; }
function getCoverMod(c) { if(c.includes('Solid'))return{e:0.75,h:1.15}; if(c.includes('Pearl'))return{e:0.3,h:0.95}; if(c.includes('Hybrid'))return{e:0.52,h:1.05}; if(c.includes('Urethane'))return{e:0.85,h:0.65}; return{e:0.5,h:1}; }
function openDossier(ball) {
  document.getElementById('dossierContent').innerHTML = `<h2>${ball.brand} ${ball.name}</h2><div style="color:var(--muted);font-size:0.82rem;margin-bottom:0.5rem;">${ball.year||''} • ${ball.cover}${ball.coverName?' ('+ball.coverName+')':''}</div><div class="spec-grid"><div class="spec-item"><strong>RG</strong><br>${ball.rg}</div><div class="spec-item"><strong>Diff</strong><br>${ball.diff}</div><div class="spec-item"><strong>Core</strong><br>${ball.core}${ball.coreName?' • '+ball.coreName:''}</div><div class="spec-item"><strong>Factory Finish</strong><br>${ball.finish||'—'}</div></div><p><strong>Motion:</strong> ${ball.motion}</p><div class="recommendation"><strong>Recommendation for ~15 mph / ~220 RPM</strong><br>${ball.rec}<br><br><strong>When to use:</strong> ${ball.when}<br><strong>When to leave it in the bag:</strong> ${ball.whenNot}</div>${ball.link?`<div class="links" style="margin-top:0.7rem;"><a href="${ball.link}" target="_blank">View on bowwwl.com →</a></div>`:''}`;
  document.getElementById('dossierModal').classList.add('open');
}
function init() {
  const list = document.getElementById('ballList');
  balls.forEach(b => {
    const card = document.createElement('div');
    card.className = 'ball-card'+(b.id===selectedBall.id?' active':'');
    card.innerHTML = `<div class="ball-dot" style="background:${b.color}">${b.brand[0]}</div><div><div class="name">${b.name}</div><div class="meta">${b.cover.split(' ')[0]} • RG ${b.rg}</div></div><button class="info-btn">Info</button>`;
    card.onclick = e => { if(e.target.classList.contains('info-btn')) return; selectedBall=b; document.querySelectorAll('.ball-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); drawLane(); };
    card.querySelector('.info-btn').onclick = e => { e.stopPropagation(); openDossier(b); };
    list.appendChild(card);
  });
  ['speed','rev','release','aim','oil'].forEach(id => document.getElementById(id).oninput = e => document.getElementById(id+'Val').textContent = e.target.value);
  document.getElementById('finish').onchange = drawLane;
  document.getElementById('pattern').onchange = drawLane;
  document.getElementById('simulate').onclick = drawLane;
  document.getElementById('recommend').onclick = () => {
    const p = document.getElementById('pattern').value;
    const cover = getCoverMod(selectedBall.cover);
    let rel = cover.e > 0.6 ? 12 : 16;
    if (p==='cheetah'||p==='dry') rel = 18;
    if (p==='shark') rel = 10;
    document.getElementById('release').value = rel;
    document.getElementById('releaseVal').textContent = rel;
    drawLane();
  };
  document.querySelector('.close').onclick = () => document.getElementById('dossierModal').classList.remove('open');
  document.getElementById('dossierModal').onclick = e => { if(e.target.id==='dossierModal') e.target.classList.remove('open'); };
  canvas = document.getElementById('lane');
  ctx = canvas.getContext('2d');
  drawLane();
}
function boardToX(board, w) { return 14 + ((39 - board) / 39) * (w - 28); }
function simulatePath(ball) {
  const speed = +document.getElementById('speed').value, rev = +document.getElementById('rev').value, release = +document.getElementById('release').value, aim = +document.getElementById('aim').value, oil = +document.getElementById('oil').value, finish = document.getElementById('finish').value, pattern = document.getElementById('pattern').value, w = canvas.width, h = canvas.height;
  const cover = getCoverMod(ball.cover), fin = getFinishMod(finish);
  const rgEarly = Math.max(0.2, Math.min(0.9, (2.60-ball.rg)*2.2));
  const diffHook = 0.7 + ball.diff*12;
  const asym = ball.core==='Asymmetric' ? 1.12 : 1.0;
  const early = (cover.e*0.5 + rgEarly*0.35 + fin.e*0.15) * fin.e;
  const hookPot = cover.h * diffHook * asym * fin.h;
  const revRatio = rev / (speed*14);
  const baseHook = hookPot * (0.55 + revRatio*0.45) / oil;
  let x = boardToX(release, w), y = h - 42, vx = Math.sin(aim * Math.PI/180) * 0.85, vy = -5.6;
  const points = []; let breakpoint = null;
  for (let t=0; t<240; t++) {
    points.push({x,y});
    const board = 39 - ((x-14)/(w-28))*39;
    let fr = 0.28;
    if (pattern==='house') fr = (board<8||board>31)?1.55 : (board>15&&board<24?0.22:0.6);
    else if (pattern==='cheetah') fr = 1.6; else if (pattern==='dry') fr = 1.8; else if (pattern==='shark') fr = 0.42; else fr = 0.58;
    fr *= oil;
    const prog = (h-42-y)/(h-125);
    const phaseStart = 0.40 - early*0.18;
    let phase = 0;
    if (prog > phaseStart) { const p = Math.min(1, (prog-phaseStart)/(1-phaseStart)); phase = Math.pow(p, 1.5) * (1.05 - p*0.25); }
    const force = baseHook * fr * phase * 0.36;
    vx -= force * 0.10;
    if (prog > 0.80) vx *= 0.983;
    x += vx; y += vy;
    if (!breakpoint && phase>0.28 && force>0.04) breakpoint = {x,y,board};
    if (y < 60) break;
  }
  return {points, breakpoint};
}
function drawPins(w, h) {
  const baseY = 68, spacing = 14, centerX = boardToX(20, w);
  const pins = [
    {n:1,x:centerX,y:baseY},
    {n:2,x:centerX-spacing*0.85,y:baseY-spacing*0.95},
    {n:3,x:centerX+spacing*0.85,y:baseY-spacing*0.95},
    {n:4,x:centerX-spacing*1.7,y:baseY-spacing*1.9},
    {n:5,x:centerX,y:baseY-spacing*1.9},
    {n:6,x:centerX+spacing*1.7,y:baseY-spacing*1.9},
    {n:7,x:centerX-spacing*2.55,y:baseY-spacing*2.85},
    {n:8,x:centerX-spacing*0.85,y:baseY-spacing*2.85},
    {n:9,x:centerX+spacing*0.85,y:baseY-spacing*2.85},
    {n:10,x:centerX+spacing*2.55,y:baseY-spacing*2.85}
  ];
  pins.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=0.5; ctx.stroke();
    ctx.fillStyle='#000'; ctx.font='6px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.n, p.x, p.y+2);
  });
  ctx.strokeStyle='rgba(218,175,55,0.75)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(centerX+10, baseY-spacing*0.5, 15, 0, Math.PI*2); ctx.stroke();
}
function drawLane() {
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#1a4d35';
  ctx.fillRect(14, 24, w-28, h-58);
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.font='6px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.textAlign='center';
  for (let i=1; i<=39; i++) {
    const x = boardToX(i, w);
    ctx.beginPath(); ctx.moveTo(x,24); ctx.lineTo(x,h-34); ctx.stroke();
    if (i%5===0) ctx.fillText(i, x, h-20);
  }
  const foulY = h - 34;
  const pxPerFt = (foulY - 68) / 60;
  const dotsY = foulY - (7.5 * pxPerFt);
  ctx.fillStyle = '#1a1a1a';
  for (let i=5; i<=35; i+=5) { const x = boardToX(i, w); ctx.beginPath(); ctx.arc(x, dotsY, 1.5, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '4px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('DOTS', 16, dotsY - 3);
  const arrowY = foulY - (15 * pxPerFt);
  [5,10,15,20,25,30,35].forEach(b=>{ const x = boardToX(b, w); ctx.fillStyle = b===20 ? '#DAAF37' : '#e74c3c'; ctx.beginPath(); ctx.moveTo(x, arrowY-3); ctx.lineTo(x-2.2, arrowY+2.2); ctx.lineTo(x+2.2, arrowY+2.2); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '4px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('ARROWS', 16, arrowY - 4);
  const rangeY = foulY - (37 * pxPerFt);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 0.7;
  [10,15,20,25,30].forEach(b=>{ const x = boardToX(b, w); ctx.beginPath(); ctx.moveTo(x, rangeY); ctx.lineTo(x, rangeY + 8); ctx.stroke(); });
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '4px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('RANGE', 16, rangeY - 2);
  const footY = h - 10;
  ctx.fillStyle = '#0a0a0a';
  for (let i=5; i<=35; i+=5) { const x = boardToX(i, w); ctx.beginPath(); ctx.arc(x, footY, 1.6, 0, Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(14,h-34); ctx.lineTo(w-14,h-34); ctx.stroke();
  const bakerY = foulY - (46 * pxPerFt);
  const bakerH = (4 * pxPerFt);
  const bakerX1 = boardToX(8, w);
  const bakerX2 = boardToX(5, w);
  ctx.fillStyle = 'rgba(218,175,55,0.2)';
  ctx.fillRect(bakerX1, bakerY, bakerX2 - bakerX1, bakerH);
  ctx.strokeStyle = 'rgba(218,175,55,0.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bakerX1, bakerY, bakerX2 - bakerX1, bakerH);
  ctx.fillStyle = '#DAAF37';
  ctx.font = '4.5px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BAKER', (bakerX1+bakerX2)/2, bakerY - 3);
  drawPins(w,h);
  const result = simulatePath(selectedBall);
  const pts = result.points;
  ctx.beginPath(); ctx.strokeStyle = selectedBall.color; ctx.lineWidth = 2.2;
  pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y)); ctx.stroke();
  if (result.breakpoint) { ctx.fillStyle='#ff6b35'; ctx.beginPath(); ctx.arc(result.breakpoint.x, result.breakpoint.y, 3, 0, Math.PI*2); ctx.fill(); }
  if (pts.length) { const last=pts[pts.length-1]; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(last.x,last.y,4,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=selectedBall.color; ctx.lineWidth=1; ctx.stroke(); }
  const endBoard = pts.length ? (39 - ((pts.at(-1).x-14)/(w-28))*39) : null;
  let pocketCall='—', isStrike=false;
  if (endBoard!==null) { if (endBoard>=17.5 && endBoard<=19.5) { pocketCall='FLUSH'; isStrike=true; } else if (endBoard>=16.5 && endBoard<17.5) { pocketCall='LIGHT'; isStrike=true; } else if (endBoard>19.5 && endBoard<=20.8) { pocketCall='HIGH'; isStrike=true; } else if (endBoard<16.5) pocketCall='LIGHT MISS'; else pocketCall='HIGH MISS'; }
  document.getElementById('strikeBanner').classList.toggle('show', isStrike);
  document.getElementById('strikeBanner').textContent = isStrike ? pocketCall : 'STRIKE';
  let entryAngle=null;
  if (pts.length>5) { const last=pts[pts.length-1], prev=pts[pts.length-4]; entryAngle = Math.abs(Math.atan2(last.x-prev.x, last.y-prev.y)*180/Math.PI); }
  const finish = document.getElementById('finish').value;
  document.getElementById('infoPanel').innerHTML = `<strong>${selectedBall.brand} ${selectedBall.name}</strong> — Factory: ${selectedBall.finish||'—'}<br>Finish: <strong>${finish==='factory'?'Factory':finish}</strong> • Entry: <strong>${endBoard?endBoard.toFixed(1):'—'}</strong> • Angle: <strong>${entryAngle?entryAngle.toFixed(1):'—'}°</strong><br>Pocket: <strong style="color:#DAAF37">${pocketCall}</strong><br><span style="font-size:0.7rem;color:#94a3b8">Dots ~7.5ft • Arrows ~15ft • Range ~37ft • Baker Box boards 5-8 at 42-46ft</span>`;
}
init();
</script>
</body>
</html>
