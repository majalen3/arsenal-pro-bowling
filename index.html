<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbanek Honey Badgers — Arsenal Pro</title>
<style>
  :root { --bg:#0a0e17; --surface:#141b28; --surface-2:#1c2538; --gold:#DAAF37; --green:#0F4D34; --text:#f1f5f9; --muted:#94a3b8; --border:#2a3548; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(90deg,var(--green),#0a1528); padding:0.85rem 1.25rem; border-bottom:2px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.35rem; color:var(--gold); font-weight:800; }
  .slogan { font-size:0.65rem; color:var(--gold); opacity:0.85; }
  .badge { font-size:0.72rem; background:#000; padding:0.3rem 0.7rem; border-radius:16px; border:1px solid var(--gold); }
  body { min-height:100vh; }
  .container { display:flex; flex:1; min-height:0; }
  .sidebar { width:240px; background:var(--surface); border-right:1px solid var(--border); overflow-y:auto; padding:0.75rem; flex-shrink:0; }
  .sidebar h2 { font-size:0.85rem; color:var(--gold); margin-bottom:0.5rem; font-weight:700; }
  .ball-card { background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:0.55rem 0.6rem; margin-bottom:0.4rem; cursor:pointer; display:flex; align-items:center; gap:0.55rem; position:relative; }
  .ball-card.active { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .ball-dot { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.58rem; font-weight:800; color:#000; }
  .ball-card .name { font-weight:600; font-size:0.86rem; }
  .ball-card .meta { font-size:0.6rem; color:var(--muted); }
  .info-btn { position:absolute; right:6px; top:6px; background:#2a3548; color:var(--gold); border:none; border-radius:4px; padding:2px 6px; font-size:0.62rem; cursor:pointer; width:auto; margin:0; }
  .main { flex:1; display:flex; flex-direction:row; padding:0.6rem; gap:0.6rem; min-width:0; }
  .lane-area { flex:1; display:flex; flex-direction:column; gap:0.5rem; min-width:0; overflow-y:auto; max-height:calc(100vh - 70px); }
  .controls { width:250px; flex-shrink:0; display:flex; flex-direction:column; gap:0.35rem; background:var(--surface); padding:0.55rem; border-radius:10px; border:1px solid var(--border); overflow-y:auto; max-height:calc(100vh - 70px); }
  .control-group { display:flex; flex-direction:column; }
  .control-group label { font-size:0.6rem; color:var(--muted); margin-bottom:2px; }
  .control-group span { font-size:0.72rem; color:var(--gold); }
  .full { grid-column:1 / -1; }
  input, select { background:#0d1320; border:1px solid var(--border); color:var(--text); padding:0.3rem 0.35rem; border-radius:6px; font-size:0.78rem; width:100%; }
  input[type=range] { padding:0; }
  button { background:var(--gold); color:#000; border:none; padding:0.4rem 0.6rem; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.78rem; width:100%; margin-top:0.2rem; }
  button.secondary { background:#2a3548; color:var(--text); }
  .canvas-wrap { background:var(--surface); border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative; border:1px solid var(--border); padding:20px 6px 6px; margin-top:8px; }
  canvas { touch-action:none; cursor:crosshair; display:block; height:calc(100vh - 250px); min-height:360px; max-height:880px; aspect-ratio:220/880; width:auto; max-width:100%; }
  .info-panel { background:var(--surface); padding:0.65rem; border-radius:10px; font-size:0.78rem; line-height:1.45; border:1px solid var(--border); }
  .miss-feedback { background:#122a22; border-left:3px solid var(--gold); padding:0.5rem 0.65rem; border-radius:6px; font-size:0.8rem; font-weight:600; }
  .miss-feedback.light, .miss-feedback.high { border-left-color:#e74c3c; background:#2a1717; }
  .strike-banner { position:absolute; top:-12px; z-index:2; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; font-weight:800; padding:0.35rem 1.1rem; border-radius:20px; font-size:0.95rem; display:none; white-space:nowrap; }
  .strike-banner { background:#22c55e; color:#fff; }
  .miss-feedback.strike { border-left-color:#22c55e; background:#0f2f1c; color:#86efac; }
  .miss-feedback.gutter { border-left-color:#e74c3c; background:#2a1717; }
  .miss-feedback.angle { border-left-color:#f59e0b; }
  .strike-banner.show { display:block; }
  .status { font-size:0.68rem; color:var(--muted); min-height:1em; }
  .status.ok { color:#4ade80; } .status.off { color:#f59e0b; }
  .saved-lines { display:flex; flex-direction:column; gap:0.3rem; }
  .line-item { display:flex; gap:0.3rem; align-items:stretch; }
  .line-item button { margin:0; }
  .line-item .load { flex:1; text-align:left; background:var(--surface-2); color:var(--text); border:1px solid var(--border); font-weight:600; }
  .line-item .load small { display:block; color:var(--muted); font-weight:400; font-size:0.62rem; }
  .line-item .del { width:34px; flex:none; background:#2a3548; color:var(--muted); }
  details.alley { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.5rem 0.65rem; font-size:0.78rem; }
  details.alley summary { cursor:pointer; color:var(--gold); font-weight:700; min-height:28px; display:flex; align-items:center; }
  details.alley .row { display:grid; grid-template-columns:1fr 1fr; gap:0.35rem; margin:0.4rem 0; }
  details.alley ul { list-style:none; font-size:0.72rem; color:var(--muted); margin-top:0.3rem; }
  details.alley h4 { color:var(--text); font-size:0.72rem; margin-top:0.6rem; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:100; align-items:center; justify-content:center; padding:1rem; }
  .modal.open { display:flex; }
  .modal-content { background:var(--surface); border:1px solid var(--gold); border-radius:14px; width:min(620px,95vw); max-height:90vh; overflow-y:auto; padding:1.4rem; }
  .modal-content h2 { color:var(--gold); }
  .modal-content .close { float:right; cursor:pointer; font-size:1.6rem; color:var(--muted); }
  .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin:0.8rem 0; }
  .spec-item { background:var(--surface-2); padding:0.55rem; border-radius:6px; }
  .recommendation { background:#122a22; border-left:3px solid var(--gold); padding:0.85rem; margin-top:0.8rem; border-radius:6px; }
  .links a { color:var(--gold); }
  @media (max-width:799px) {
    header { padding:0.45rem 0.75rem; }
    header h1 { font-size:1rem; }
    .container { flex-direction:column; }
    .sidebar { width:100%; border-right:none; border-bottom:1px solid var(--border); padding:0.4rem; overflow-x:auto; overflow-y:hidden; display:flex; align-items:center; gap:0.4rem; -webkit-overflow-scrolling:touch; }
    .sidebar h2 { display:none; }
    #ballList { display:flex; gap:0.4rem; }
    .ball-card { flex:0 0 auto; margin:0; padding:0.35rem 2.6rem 0.35rem 0.45rem; min-height:48px; }
    .ball-card .meta { display:none; }
    .main { flex-direction:column; padding:0.4rem; }
    .lane-area { display:contents; }
    .canvas-wrap { order:0; } .miss-feedback { order:1; } .controls { order:2; } .info-panel { order:3; } details.alley { order:4; }
    .main { gap:0.5rem; }
    .controls { width:100%; max-height:none; overflow:visible; display:grid; grid-template-columns:1fr 1fr; gap:0.4rem 0.6rem; padding:0.5rem; }
    .control-group { min-width:0; }
    input, select { min-height:40px; font-size:16px; }
    input[type=range] { min-height:32px; }
    button { min-height:42px; font-size:0.85rem; }
    .info-btn { min-height:0; padding:4px 8px; }
    .line-item .del { min-height:42px; }
    canvas { height:min(60vh, 880px); min-height:0; }
    details.alley summary { min-height:40px; }
  }
</style>
</head>
<body>
<header>
  <div><h1>URBANEK HONEY BADGERS</h1><div class="slogan">Fearless. Relentless. Always Hunting Strikes.</div></div>
  <div class="badge">Arsenal Pro</div>
</header>
<div class="container">
  <aside class="sidebar"><h2>ARSENAL</h2><div id="ballList"></div></aside>
  <main class="main">
    <div class="lane-area">
      <div class="canvas-wrap"><div class="strike-banner" id="strikeBanner">STRIKE</div><canvas id="lane" width="220" height="880"></canvas></div>
      <div class="info-panel" id="infoPanel">Head pin closest to bowler. Board 1 on right. Hooks left toward pocket.</div>
      <div class="miss-feedback" id="missFeedback" aria-live="polite"></div>
      <details class="alley" id="alleyNotes"><summary>Alley notes</summary>
        <h4>Surface log</h4>
        <button class="secondary" id="logFinish">Log finish today</button>
        <ul id="surfaceList"></ul>
        <h4>Pattern note</h4>
        <div class="row"><input id="noteLane" placeholder="Lane #" maxlength="10" inputmode="numeric"><input id="noteOil" placeholder="Oil level (e.g. heavy)" maxlength="40"></div>
        <input id="noteAdj" placeholder="Adjustment (e.g. 2 boards left)" maxlength="300" style="margin-bottom:0.3rem">
        <button id="saveNote">Save note</button>
        <ul id="noteList"></ul>
      </details>
    </div>
    <div class="controls">
      <div class="control-group"><label>SPEED</label><input type="range" id="speed" min="12" max="22" value="15" step="0.5"><span id="speedVal">15</span></div>
      <div class="control-group"><label>REV</label><input type="range" id="rev" min="100" max="500" value="220" step="10"><span id="revVal">220</span></div>
      <div class="control-group"><label>RELEASE</label><input type="range" id="release" min="5" max="30" value="12" step="1"><span id="releaseVal">12</span></div>
      <div class="control-group"><label>AIM °</label><input type="range" id="aim" min="-8" max="8" value="-4" step="0.5"><span id="aimVal">-4</span></div>
      <div class="control-group"><label>OIL</label><input type="range" id="oil" min="0.6" max="1.5" value="1" step="0.1"><span id="oilVal">1.0</span></div>
      <div class="control-group"><label>FINISH</label><select id="finish"><option value="factory">Factory</option><option value="500">500</option><option value="1000">1000</option><option value="2000">2000</option><option value="3000">3000</option><option value="polished">Polished</option></select></div>
      <div class="control-group"><label>PATTERN</label><select id="pattern"><option value="house">House</option><option value="sport">Sport</option><option value="cheetah">Cheetah</option><option value="scorpion">Scorpion</option><option value="shark">Shark</option><option value="dry">Dry</option></select></div>
      <button id="simulate">Simulate</button>
      <button class="secondary" id="recommend">Recommended</button>
      <div class="control-group full"><label>LINE NAME</label><input id="lineName" maxlength="60" placeholder="e.g. Lane 12 fresh"></div>
      <div class="control-group full"><label>NOTE</label><input id="lineNote" maxlength="200" placeholder="optional note"></div>
      <button class="full" id="saveLine">Save Line</button>
      <div class="status full" id="saveStatus"></div>
      <div class="control-group full"><label>SAVED LINES (this ball)</label><div class="saved-lines" id="savedLines"></div></div>
    </div>
  </main>
</div>
<div class="modal" id="dossierModal"><div class="modal-content"><span class="close">&times;</span><div id="dossierContent"></div></div></div>
<script>
const balls = [
  {id:'rattler-big-bite', brand:'Radical', name:'Rattler Big Bite', color:'#DAAF37', rg:2.480, diff:0.035, cover:'Hybrid Reactive', coverName:'S.H.A.R.P. Hybrid', core:'Symmetric', coreName:'Rattler', finish:'500/1500/3000 Siaair', year:2024, motion:'Stronger mid-lane read with continuous motion.', rec:'YOUR PRIMARY HOUSE-SHOT BENCHMARK.', when:'Fresh to medium house.', whenNot:'Very dry lanes.', link:'https://www.bowwwl.com/bowling-balls/radical-rattler-big-bite'},
  {id:'deadly-rattler', brand:'Radical', name:'Deadly Rattler', color:'#00d4ff', rg:2.480, diff:0.035, cover:'Pearl Reactive', coverName:'HK22 HyperKinetic Pearl', core:'Symmetric', coreName:'Rattler', finish:'500/1000/1500 Crown', year:2023, motion:'Cleaner through the fronts, sharper backend.', rec:'YOUR TRANSITION BALL.', when:'Medium to light oil.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/radical-deadly-rattler'},
  {id:'super-nova', brand:'Storm', name:'Super Nova', color:'#ff6b35', rg:2.490, diff:0.052, cover:'Solid Reactive', coverName:'NeX Solid', core:'Asymmetric', coreName:'Ignition', finish:'2000 Abralon', year:2022, motion:'Very early reading, strong midlane.', rec:'Heavy oil or early traction.', when:'Fresh heavy house.', whenNot:'Medium or light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-super-nova'},
  {id:'hy-road', brand:'Storm', name:'Original Hy-Road', color:'#4ade80', rg:2.570, diff:0.046, cover:'Hybrid Reactive', coverName:'R2S Hybrid', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500-grit Polished', year:2008, motion:'Classic length with strong backend.', rec:'Excellent all-around.', when:'Medium house.', whenNot:'Very heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road'},
  {id:'hy-road-pearl', brand:'Storm', name:'Hy-Road Pearl', color:'#a78bfa', rg:2.570, diff:0.046, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500 Polished', year:2010, motion:'Clean then strong angular backend.', rec:'Ideal transition or lighter oil.', when:'Medium-light oil.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-pearl'},
  {id:'hy-road-solid', brand:'Storm', name:'Hy-Road Solid', color:'#22d3ee', rg:2.570, diff:0.046, cover:'Solid Reactive', coverName:'R2S Solid', core:'Symmetric', coreName:'Inverted Fe2', finish:'2000 Abralon', year:2014, motion:'Earlier than original with controlled midlane.', rec:'Stronger than the pearls.', when:'Fresh to medium house.', whenNot:'Light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-solid'},
  {id:'astrophysix', brand:'Storm', name:'AstroPhysiX', color:'#f472b6', rg:2.480, diff:0.053, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Asymmetric', coreName:'Atomic', finish:'1500 Polished', year:2019, motion:'Length then sharp backend.', rec:'Power pearl for angle.', when:'Medium oil when you need length.', whenNot:'Heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-astrophysix'},
  {id:'ice-storm', brand:'Storm', name:'Ice Storm', color:'#67e8f9', rg:2.550, diff:0.040, cover:'Pearl Reactive', core:'Symmetric', finish:'Polished', year:2015, motion:'Cleaner, controllable pearl.', rec:'Dry lanes.', when:'Dry or broken-down.', whenNot:'Fresh oil.'},
  {id:'innovator', brand:'Radical', name:'Innovator', color:'#fb7185', rg:2.470, diff:0.050, cover:'Solid Reactive', core:'Asymmetric', year:2020, motion:'Strong early-to-mid solid.', rec:'Heavy oil control.', when:'Fresh heavy.', whenNot:'Medium or light.'},
  {id:'bigfoot-hybrid', brand:'Radical', name:'Bigfoot Hybrid', color:'#fbbf24', rg:2.468, diff:0.053, cover:'Hybrid Reactive', coverName:'HK22 Hybrid', core:'Symmetric', coreName:'Bigfoot', year:2022, motion:'Strong continuous hybrid.', rec:'Benchmark hybrid.', when:'Medium-heavy.', whenNot:'Light oil.'},
  {id:'rattler', brand:'Radical', name:'Rattler', color:'#86efac', rg:2.480, diff:0.035, cover:'Solid Reactive', coverName:'S.H.A.R.P', core:'Symmetric', coreName:'Rattler', finish:'500/1500/4000', year:2023, motion:'Benchmark solid — continuous.', rec:'Reliable control.', when:'Smooth control needed.', whenNot:'When you need more angle.'},
  {id:'ordnance-c4', brand:'900 Global', name:'Ordnance C4', color:'#c084fc', rg:2.490, diff:0.041, cover:'Hybrid Reactive', coverName:'S70 Hybrid', core:'Symmetric', coreName:'Shrapnel 2.0', finish:'4000 Abralon', year:2020, motion:'Clean hybrid.', rec:'Versatile medium-oil.', when:'Medium conditions.', whenNot:'Extremes.'},
  {id:'raw-hammer', brand:'Hammer', name:'Raw Hammer Black', color:'#94a3b8', rg:2.540, diff:0.038, cover:'Solid Reactive', core:'Symmetric', year:2021, motion:'Controlled solid.', rec:'Benchmark solid.', when:'Standard house.', whenNot:'Very light oil.'},
  {id:'rack-attack', brand:'Sports Tec', name:'Rack Attack Pro Line Urethane', color:'#f97316', rg:2.600, diff:0.015, cover:'Urethane', core:'Symmetric', year:2020, motion:'Classic urethane — smooth early roll.', rec:'Short patterns or dry.', when:'Short or dry.', whenNot:'Heavy oil.'}
];
let selectedBall = balls[0];
let canvas, ctx;
const LW=220, LH=880;

function getFinishMod(f) { if(f==='500')return{e:1.25,h:1.15}; if(f==='1000')return{e:1.12,h:1.08}; if(f==='2000')return{e:1,h:1}; if(f==='3000')return{e:0.88,h:0.95}; if(f==='polished')return{e:0.72,h:0.88}; return{e:1,h:1}; }
function getCoverMod(c) { if(c.includes('Solid'))return{e:0.75,h:1.15}; if(c.includes('Pearl'))return{e:0.3,h:0.95}; if(c.includes('Hybrid'))return{e:0.52,h:1.05}; if(c.includes('Urethane'))return{e:0.85,h:0.65}; return{e:0.5,h:1}; }
function openDossier(ball) {
  document.getElementById('dossierContent').innerHTML = `<h2>${ball.brand} ${ball.name}</h2><div style="color:var(--muted);font-size:0.82rem;margin-bottom:0.5rem;">${ball.year||''} • ${ball.cover}${ball.coverName?' ('+ball.coverName+')':''}</div><div class="spec-grid"><div class="spec-item"><strong>RG</strong><br>${ball.rg}</div><div class="spec-item"><strong>Diff</strong><br>${ball.diff}</div><div class="spec-item"><strong>Core</strong><br>${ball.core}${ball.coreName?' • '+ball.coreName:''}</div><div class="spec-item"><strong>Factory Finish</strong><br>${ball.finish||'—'}</div></div><p><strong>Motion:</strong> ${ball.motion}</p><div class="recommendation"><strong>Recommendation for ~15 mph / ~220 RPM</strong><br>${ball.rec}<br><br><strong>When to use:</strong> ${ball.when}<br><strong>When to leave it in the bag:</strong> ${ball.whenNot}</div>${ball.link?`<div class="links" style="margin-top:0.7rem;"><a href="${ball.link}" target="_blank">View on bowwwl.com →</a></div>`:''}`;
  document.getElementById('dossierModal').classList.add('open');
}
function init() {
  const list = document.getElementById('ballList');
  balls.forEach(b => {
    const card = document.createElement('div');
    card.className = 'ball-card'+(b.id===selectedBall.id?' active':'');
    card.innerHTML = `<div class="ball-dot" style="background:${b.color}">${b.brand[0]}</div><div><div class="name">${b.name}</div><div class="meta">${b.cover.split(' ')[0]} • RG ${b.rg}</div></div><button class="info-btn">Info</button>`;
    card.onclick = e => { if(e.target.classList.contains('info-btn')) return; selectedBall=b; document.querySelectorAll('.ball-card').forEach(c=>c.classList.remove('active')); card.classList.add('active'); renderSavedLines(); renderAlleyLists(); syncLines(); drawLane(); card.scrollIntoView({block:'nearest',inline:'nearest'}); };
    card.querySelector('.info-btn').onclick = e => { e.stopPropagation(); openDossier(b); };
    list.appendChild(card);
  });
  ['speed','rev','release','aim','oil'].forEach(id => document.getElementById(id).oninput = e => { document.getElementById(id+'Val').textContent = e.target.value; drawLane(); });
  document.getElementById('finish').onchange = drawLane;
  document.getElementById('pattern').onchange = drawLane;
  document.getElementById('simulate').onclick = drawLane;
  document.getElementById('recommend').onclick = () => {
    const p = document.getElementById('pattern').value;
    const cover = getCoverMod(selectedBall.cover);
    let rel = cover.e > 0.6 ? 12 : 16;
    if (p==='cheetah'||p==='dry') rel = 18;
    if (p==='shark') rel = 10;
    document.getElementById('release').value = rel;
    document.getElementById('releaseVal').textContent = rel;
    drawLane();
  };
  document.querySelector('.close').onclick = () => document.getElementById('dossierModal').classList.remove('open');
  document.getElementById('dossierModal').onclick = e => { if(e.target.id==='dossierModal') e.target.classList.remove('open'); };
  canvas = document.getElementById('lane');
  ctx = canvas.getContext('2d');
  setupDrag();
  initPersistence();
  drawLane();
}
function boardToX(board, w) { return 14 + ((39 - board) / 39) * (w - 28); }
function simulatePath(ball, ov) {
  ov = ov || {};
  const num = (k,id) => ov[k]!==undefined ? ov[k] : +document.getElementById(id).value;
  const speed = num('speed','speed'), rev = num('rev','rev'), release = num('release','release'), aim = num('aim','aim'), oil = +document.getElementById('oil').value, finish = document.getElementById('finish').value, pattern = document.getElementById('pattern').value, w = LW, h = LH;
  const cover = getCoverMod(ball.cover), fin = getFinishMod(finish);
  const rgEarly = Math.max(0.2, Math.min(0.9, (2.60-ball.rg)*2.2));
  const diffHook = 0.7 + ball.diff*12;
  const asym = ball.core==='Asymmetric' ? 1.12 : 1.0;
  const early = (cover.e*0.5 + rgEarly*0.35 + fin.e*0.15) * fin.e;
  const hookPot = cover.h * diffHook * asym * fin.h;
  const revRatio = rev / (speed*14);
  const baseHook = hookPot * (0.55 + revRatio*0.45) / oil;
  let x = boardToX(release, w), y = h - 42, vx = Math.sin(aim * Math.PI/180) * 0.85, vy = -5.6;
  const points = []; let breakpoint = null, gutter = false;
  for (let t=0; t<240; t++) {
    points.push({x,y});
    const board = 39 - ((x-14)/(w-28))*39;
    if (board < 1 || board > 39) { gutter = true; break; } // ball left the lane: stop the path here
    let fr = 0.28;
    if (pattern==='house') fr = (board<8||board>31)?1.55 : (board>15&&board<24?0.22:0.6);
    else if (pattern==='cheetah') fr = 1.6; else if (pattern==='dry') fr = 1.8; else if (pattern==='shark') fr = 0.42; else fr = 0.58;
    fr *= oil;
    const prog = (h-42-y)/(h-125);
    const phaseStart = 0.40 - early*0.18;
    let phase = 0;
    if (prog > phaseStart) { const p = Math.min(1, (prog-phaseStart)/(1-phaseStart)); phase = Math.pow(p, 1.5) * (1.05 - p*0.25); }
    const force = baseHook * fr * phase * 0.36;
    vx -= force * 0.10;
    if (prog > 0.80) vx *= 0.983;
    x += vx; y += vy;
    if (!breakpoint && phase>0.28 && force>0.04) breakpoint = {x,y,board};
    if (y < 60) break;
  }
  return {points, breakpoint, gutter};
}
function drawPins(w, h) {
  const baseY = 68, spacing = 14, centerX = boardToX(20, w);
  const pins = [
    {n:1,x:centerX,y:baseY},
    {n:2,x:centerX-spacing*0.85,y:baseY-spacing*0.95},
    {n:3,x:centerX+spacing*0.85,y:baseY-spacing*0.95},
    {n:4,x:centerX-spacing*1.7,y:baseY-spacing*1.9},
    {n:5,x:centerX,y:baseY-spacing*1.9},
    {n:6,x:centerX+spacing*1.7,y:baseY-spacing*1.9},
    {n:7,x:centerX-spacing*2.55,y:baseY-spacing*2.85},
    {n:8,x:centerX-spacing*0.85,y:baseY-spacing*2.85},
    {n:9,x:centerX+spacing*0.85,y:baseY-spacing*2.85},
    {n:10,x:centerX+spacing*2.55,y:baseY-spacing*2.85}
  ];
  pins.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,5.5,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=0.5; ctx.stroke();
    ctx.fillStyle='#000'; ctx.font='6px sans-serif'; ctx.textAlign='center';
    ctx.fillText(p.n, p.x, p.y+2);
  });
  ctx.strokeStyle='rgba(218,175,55,0.75)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.arc(centerX+10, baseY-spacing*0.5, 15, 0, Math.PI*2); ctx.stroke();
}

/* ===== Breakpoint-style analysis =====
   Coordinates: feet 0 = foul line, 15 = arrows, 60 = head pin. Board 1-39 (1 right, 20 center). Pocket = board 17.5.
   Strike = entry board 16.8-18.2 AND entry angle 4-6 deg. The angle is measured on the drawn lane
   (the lane is drawn stretched sideways, so this is the visual pocket angle, same as the old panel).
   Board in tolerance + angle in tolerance means the ball is inside the 17.5-to-20 pocket line, i.e. sweeps the 5-pin. */
const HEAD_Y = 68, FOUL_Y = LH - 34, PX_FT = (FOUL_Y - HEAD_Y) / 60;
const yToFeet = y => (FOUL_Y - y) / PX_FT;
const xToBoard = x => 39 - ((x - 14) / (LW - 28)) * 39;
const OIL_LEN = {house:38, sport:42, cheetah:35, scorpion:42, shark:45, dry:32};
/* Rule of 31: oil length (ft) - 31 = board where the ball should exit the oil (breakpoint board).
   Only the board check is shown; the breakpoint distance is not enforced. */
function ruleOf31(pattern, bpBoard) {
  const len = OIL_LEN[pattern] || 38, target = len - 31;
  const d = bpBoard - target; // higher board = further left = further inside here
  const rel = Math.abs(d) < 0.5 ? 'on it' : (d > 0 ? d.toFixed(1)+' inside' : (-d).toFixed(1)+' outside');
  return {len, target, d, text: `Rule of 31: ${len} ft oil, target board ${target}, you are ${rel}.`};
}
function analyze(ball, ov) {
  const r = simulatePath(ball, ov), pts = r.points;
  const out = {points:pts, gutter:r.gutter, breakpoint:r.breakpoint, entryBoard:null, angle:null, strike:false, call:'', bpFeet:null, bpBoard:null};
  let entry = null;
  for (let i=1;i<pts.length;i++) if (pts[i].y <= HEAD_Y) {
    const a=pts[i-1], c=pts[i], f=(a.y-HEAD_Y)/(a.y-c.y), x=a.x+(c.x-a.x)*f;
    const b=pts[Math.max(0,i-4)];
    entry = {board:xToBoard(x), angle:Math.abs(Math.atan2(b.x-c.x, b.y-c.y)*180/Math.PI)}; break;
  }
  if (r.gutter || !entry) { out.call = 'GUTTER'; if (!entry) { const e=pts[pts.length-1]; out.entryBoard = e?xToBoard(e.x):null; } }
  else {
    out.entryBoard = entry.board; out.angle = entry.angle;
    const bOK = Math.abs(entry.board-17.5) <= 0.7, aOK = entry.angle>=4 && entry.angle<=6;
    out.strike = bOK && aOK;
    out.call = out.strike ? 'STRIKE' : bOK ? 'ANGLE' : entry.board<17.5 ? 'LIGHT' : 'HIGH';
  }
  if (r.breakpoint) { out.bpFeet = yToFeet(r.breakpoint.y); out.bpBoard = r.breakpoint.board; }
  return out;
}
function sensitivity(ball) {
  const g = id => +document.getElementById(id).value;
  const rel = g('release'), sp = g('speed'), rv = g('rev');
  const vars = [{speed:sp+0.5},{speed:sp-0.5},{rev:rv+20},{rev:rv-20},{release:rel+1},{release:rel-1}];
  return vars.filter(v => analyze(ball, v).strike).length + ' of ' + vars.length;
}
function coachLine(a) {
  const f1 = v => v.toFixed(1);
  if (a.call==='GUTTER') return 'In the gutter.';
  const b = f1(a.entryBoard);
  if (a.call==='STRIKE') return `Strike. ${b}, sweeping the 5.`;
  if (a.call==='ANGLE') return `On ${b}. The angle is missing the 5-pin. ${f1(a.angle)}\u00b0, need 4-6.`;
  const off = Math.abs(a.entryBoard-17.5), mv = Math.max(1, Math.round(off));
  if (a.call==='LIGHT') return `Light. ${b}, ${f1(off)} boards short of 17.5. Move feet left ${mv} board${mv>1?'s':''} or go stronger.`;
  return `High. ${b}, ${f1(off)} boards past 17.5. Move feet right ${mv} board${mv>1?'s':''} or go weaker.`;
}
function drawLane() {
  const w=LW, h=LH;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  if (canvas.width!==Math.round(LW*dpr)) { canvas.width=Math.round(LW*dpr); canvas.height=Math.round(LH*dpr); }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle='#1a4d35';
  ctx.fillRect(14, 24, w-28, h-58);
  ctx.strokeStyle='rgba(255,255,255,0.05)';
  ctx.font='6px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.textAlign='center';
  for (let i=1; i<=39; i++) {
    const x = boardToX(i, w);
    ctx.beginPath(); ctx.moveTo(x,24); ctx.lineTo(x,h-34); ctx.stroke();
    if (i%5===0) ctx.fillText(i, x, h-20);
  }
  const foulY = h - 34;
  const pxPerFt = (foulY - 68) / 60;
  const dotsY = foulY - (7.5 * pxPerFt);
  ctx.fillStyle = '#1a1a1a';
  for (let i=5; i<=35; i+=5) { const x = boardToX(i, w); ctx.beginPath(); ctx.arc(x, dotsY, 1.5, 0, Math.PI*2); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '4px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('DOTS', 16, dotsY - 3);
  const arrowY = foulY - (15 * pxPerFt);
  [5,10,15,20,25,30,35].forEach(b=>{ const x = boardToX(b, w); ctx.fillStyle = b===20 ? '#DAAF37' : '#e74c3c'; ctx.beginPath(); ctx.moveTo(x, arrowY-3); ctx.lineTo(x-2.2, arrowY+2.2); ctx.lineTo(x+2.2, arrowY+2.2); ctx.closePath(); ctx.fill(); });
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.font = '4px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('ARROWS', 16, arrowY - 4);
  const rangeY = foulY - (37 * pxPerFt);
  ctx.strokeStyle = 'rgba(255,255,255,0.28)'; ctx.lineWidth = 0.7;
  [10,15,20,25,30].forEach(b=>{ const x = boardToX(b, w); ctx.beginPath(); ctx.moveTo(x, rangeY); ctx.lineTo(x, rangeY + 8); ctx.stroke(); });
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '4px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('RANGE', 16, rangeY - 2);
  const footY = h - 10;
  ctx.fillStyle = '#0a0a0a';
  for (let i=5; i<=35; i+=5) { const x = boardToX(i, w); ctx.beginPath(); ctx.arc(x, footY, 1.6, 0, Math.PI*2); ctx.fill(); }
  ctx.strokeStyle='#fff'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(14,h-34); ctx.lineTo(w-14,h-34); ctx.stroke();
  const bakerY = foulY - (46 * pxPerFt);
  const bakerH = (4 * pxPerFt);
  const bakerX1 = boardToX(8, w);
  const bakerX2 = boardToX(5, w);
  ctx.fillStyle = 'rgba(218,175,55,0.2)';
  ctx.fillRect(bakerX1, bakerY, bakerX2 - bakerX1, bakerH);
  ctx.strokeStyle = 'rgba(218,175,55,0.7)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bakerX1, bakerY, bakerX2 - bakerX1, bakerH);
  ctx.fillStyle = '#DAAF37';
  ctx.font = '4.5px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('BAKER', (bakerX1+bakerX2)/2, bakerY - 3);
  drawPins(w,h);
  const result = analyze(selectedBall);
  const pts = result.points, isStrike = result.strike;
  const relV = +document.getElementById('release').value, aimV = +document.getElementById('aim').value;
  // aim target marker at the arrows: 1 board per degree of aim, dashed line from the release
  const aimBoard = Math.max(1, Math.min(39, relV - aimV)), arrowYm = FOUL_Y - 15*PX_FT, relX = boardToX(relV, w);
  ctx.setLineDash([3,3]); ctx.strokeStyle='rgba(218,175,55,0.8)'; ctx.lineWidth=0.8;
  ctx.beginPath(); ctx.moveTo(relX, FOUL_Y-4); ctx.lineTo(boardToX(aimBoard,w), arrowYm); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#DAAF37'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(boardToX(aimBoard,w), arrowYm, 4, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle='#DAAF37'; ctx.beginPath(); ctx.arc(relX, FOUL_Y-4, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.strokeStyle = isStrike ? '#22c55e' : selectedBall.color; ctx.lineWidth = isStrike ? 3 : 2.2;
  if (isStrike) { ctx.shadowColor='#22c55e'; ctx.shadowBlur=6; }
  pts.forEach((p,i)=> i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y)); ctx.stroke(); ctx.shadowBlur=0;
  if (result.breakpoint) { ctx.fillStyle='#ff6b35'; ctx.beginPath(); ctx.arc(result.breakpoint.x, result.breakpoint.y, 3, 0, Math.PI*2); ctx.fill(); }
  if (pts.length) { const last=pts[pts.length-1]; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(last.x,last.y,4,0,Math.PI*2); ctx.fill(); ctx.strokeStyle=isStrike?'#22c55e':selectedBall.color; ctx.lineWidth=1; ctx.stroke(); }
  const pocketCall = result.call, endBoard = result.entryBoard;
  window.lastResult = {points:pts, endBoard, pocketCall, strike:isStrike, angle:result.angle, startX:pts.length?pts[0].x:null, endX:pts.length?pts.at(-1).x:null};
  const mf = document.getElementById('missFeedback');
  const mfTxt = coachLine(result);
  mf.className='miss-feedback '+(isStrike?'strike':pocketCall==='LIGHT'?'light':pocketCall==='HIGH'?'high':pocketCall==='GUTTER'?'gutter':'angle');
  mf.textContent=mfTxt; mf.style.display=''; mf.dataset.call=pocketCall;
  const banner = document.getElementById('strikeBanner');
  banner.classList.toggle('show', isStrike); banner.textContent='STRIKE';
  const finish = document.getElementById('finish').value, pattern = document.getElementById('pattern').value;
  const f1 = v => v==null ? '\u2014' : v.toFixed(1);
  const hooked = result.bpBoard==null ? null : relV - result.bpBoard;
  const bpTxt = result.bpFeet==null ? '\u2014' : `${Math.round(result.bpFeet)} ft, board ${f1(result.bpBoard)}`;
  const r31 = result.bpBoard==null ? '' : ruleOf31(pattern, result.bpBoard).text;
  document.getElementById('infoPanel').innerHTML = `<strong>${selectedBall.brand} ${selectedBall.name}</strong> \u2014 Factory: ${selectedBall.finish||'\u2014'} \u2022 Finish: <strong>${finish==='factory'?'Factory':finish}</strong><br>Angle <strong>${f1(result.angle)}\u00b0</strong> \u2022 Breakpoint <strong>${bpTxt}</strong> \u2022 Entry <strong>${f1(endBoard)}</strong> \u2022 Hooked <strong>${hooked==null?'\u2014':Math.abs(hooked).toFixed(1)} boards</strong><br>${r31}<br>Half a mph, 20 rpm, or one board: <strong>${sensitivity(selectedBall)} still strike.</strong><br><span style="font-size:0.68rem;color:#94a3b8">Drag the lane: near the foul line sets release, up-lane sets aim at the arrows. Dots ~7.5ft \u2022 Arrows ~15ft \u2022 Range ~37ft \u2022 Baker Box boards 5-8 at 42-46ft</span>`;
}

/* ===== Drag to set (pointer events; touch-action:none on the canvas only) ===== */
function setupDrag() {
  let mode = null;
  const pos = e => { const r = canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*LW, y:(e.clientY-r.top)/r.height*LH}; };
  const apply = e => {
    const p = pos(e);
    const board = xToBoard(Math.max(14, Math.min(LW-14, p.x)));
    if (mode==='release') setControl('release', Math.max(5, Math.min(30, Math.round(board))));
    else { const rel = +document.getElementById('release').value; setControl('aim', Math.max(-8, Math.min(8, Math.round((rel-board)*2)/2))); }
    drawLane();
  };
  canvas.addEventListener('pointerdown', e => {
    const p = pos(e); mode = (FOUL_Y - p.y) / PX_FT < 9 ? 'release' : 'aim';
    try { canvas.setPointerCapture(e.pointerId); } catch(_) {}
    apply(e); e.preventDefault();
  });
  canvas.addEventListener('pointermove', e => { if (mode) apply(e); });
  const end = () => { mode = null; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
}

/* ===== Persistence: Render API + localStorage mirror ===== */
const API_BASE = new URLSearchParams(location.search).get('api') || 'https://arsenal-pro-api.onrender.com';
const API_TIMEOUT = 6000;
const LS = { lines:'ap_lines', surface:'ap_surface', notes:'ap_notes' };
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch(e) { return []; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
async function api(path, opts={}) {
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), API_TIMEOUT);
  try {
    const r = await fetch(API_BASE+path, { ...opts, signal:ctl.signal, headers:opts.body?{'Content-Type':'application/json'}:undefined });
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}
function setStatus(txt, cls) { const el=document.getElementById('saveStatus'); el.textContent=txt; el.className='status full '+(cls||''); }
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setControl(id, v) { if (v===null||v===undefined) return; const el=document.getElementById(id); el.value=v; const lab=document.getElementById(id+'Val'); if (lab) lab.textContent = id==='oil'?(+el.value).toFixed(1):el.value; }
function currentLine(name) {
  const g = id => document.getElementById(id).value;
  return { ballId:selectedBall.id, name, release:+g('release'), aim:+g('aim'), speed:+g('speed'), rev:+g('rev'), oil:+g('oil'), finish:g('finish'), pattern:g('pattern'), note:g('lineNote').trim() };
}
function linesForBall() { return lsGet(LS.lines).filter(l=>l.ballId===selectedBall.id).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)); }
function renderSavedLines() {
  const box = document.getElementById('savedLines'); const ls = linesForBall();
  if (!ls.length) { box.innerHTML = '<div class="status">No saved lines yet.</div>'; return; }
  box.innerHTML = ls.map((l,i)=>`<div class="line-item"><button class="load" data-i="${i}">${esc(l.name)}<small>rel ${l.release} \u2022 aim ${l.aim} \u2022 ${esc(l.finish)} \u2022 ${esc(l.pattern)}${l.note?' \u2022 '+esc(l.note):''}${l.synced?'':' \u2022 on this phone'}</small></button><button class="del" data-i="${i}" aria-label="Delete line">\u2715</button></div>`).join('');
  box.querySelectorAll('.load').forEach(b=>b.onclick=()=>loadLine(ls[+b.dataset.i]));
  box.querySelectorAll('.del').forEach(b=>b.onclick=()=>deleteLine(ls[+b.dataset.i]));
}
function loadLine(l) {
  ['release','aim','speed','rev','oil'].forEach(k=>setControl(k,l[k]));
  setControl('finish',l.finish); setControl('pattern',l.pattern);
  document.getElementById('lineName').value = l.name; document.getElementById('lineNote').value = l.note||'';
  drawLane(); setStatus('Loaded "'+l.name+'"','ok');
}
async function pushLine(l) {
  const body = { ballId:l.ballId, name:l.name, release:l.release, aim:l.aim, speed:l.speed, rev:l.rev, oil:l.oil, finish:l.finish, pattern:l.pattern, note:l.note||'' };
  const r = await api('/api/lines', { method:'POST', body:JSON.stringify(body) });
  const all = lsGet(LS.lines); const m = all.find(x=>x.ballId===l.ballId && x.name===l.name);
  if (m) { m.synced = true; m.id = r.id; lsSet(LS.lines, all); }
}
async function saveLine() {
  const name = document.getElementById('lineName').value.trim();
  if (!name) { setStatus('Type a line name first','off'); document.getElementById('lineName').focus(); return; }
  const l = { ...currentLine(name), updatedAt:Date.now(), synced:false };
  const all = lsGet(LS.lines).filter(x=>!(x.ballId===l.ballId && x.name===l.name)); all.push(l); lsSet(LS.lines, all);
  renderSavedLines(); setStatus('Saving\u2026');
  try { await pushLine(l); setStatus('Saved','ok'); } catch(e) { setStatus('Offline (saved on this phone)','off'); }
  renderSavedLines();
}
async function deleteLine(l) {
  lsSet(LS.lines, lsGet(LS.lines).filter(x=>!(x.ballId===l.ballId && x.name===l.name))); renderSavedLines();
  if (l.id) { try { await api('/api/lines/'+l.id, {method:'DELETE'}); setStatus('Deleted','ok'); } catch(e) { setStatus('Deleted here; server unreachable','off'); } }
}
async function syncLines() {
  const ballId = selectedBall.id;
  try {
    const server = await api('/api/lines?ballId='+encodeURIComponent(ballId));
    const all = lsGet(LS.lines);
    server.forEach(s=>{
      const t = Date.parse(s.updatedAt)||0; const i = all.findIndex(x=>x.ballId===s.ballId && x.name===s.name);
      const rec = { ballId:s.ballId, name:s.name, release:s.release, aim:s.aim, speed:s.speed, rev:s.rev, oil:s.oil, finish:s.finish, pattern:s.pattern, note:s.note||'', updatedAt:t, synced:true, id:s.id };
      if (i<0) all.push(rec); else if (all[i].synced || t>=(all[i].updatedAt||0)) all[i]=rec;
    });
    lsSet(LS.lines, all);
    if (selectedBall.id===ballId) renderSavedLines();
    for (const l of all.filter(x=>x.ballId===ballId && !x.synced)) { try { await pushLine(l); } catch(e) { break; } }
    if (selectedBall.id===ballId) renderSavedLines();
    setStatus('Synced','ok');
  } catch(e) { setStatus('Offline (saved on this phone)','off'); }
}
/* surface log + pattern notes */
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
function renderAlleyLists() {
  const sl = lsGet(LS.surface).filter(x=>x.ballId===selectedBall.id).slice(-3).reverse();
  document.getElementById('surfaceList').innerHTML = sl.length ? sl.map(x=>`<li>${esc(x.date)} \u2014 ${esc(x.finish)}</li>`).join('') : '<li>No entries for this ball.</li>';
  const nl = lsGet(LS.notes).slice(-3).reverse();
  document.getElementById('noteList').innerHTML = nl.length ? nl.map(x=>`<li>Lane ${esc(x.lane)} \u2022 ${esc(x.oil)} \u2014 ${esc(x.adjustment)}</li>`).join('') : '<li>No notes yet.</li>';
}
async function logFinish() {
  const e = { ballId:selectedBall.id, date:today(), finish:document.getElementById('finish').value };
  const all = lsGet(LS.surface); all.push(e); lsSet(LS.surface, all.slice(-200)); renderAlleyLists(); setStatus('Saving\u2026');
  try { await api('/api/surface-log', {method:'POST', body:JSON.stringify(e)}); setStatus('Saved','ok'); } catch(err) { setStatus('Offline (saved on this phone)','off'); }
}
async function saveNote() {
  const e = { lane:document.getElementById('noteLane').value.trim(), oil:document.getElementById('noteOil').value.trim(), adjustment:document.getElementById('noteAdj').value.trim() };
  if (!e.lane||!e.oil||!e.adjustment) { setStatus('Fill lane, oil and adjustment','off'); return; }
  const all = lsGet(LS.notes); all.push(e); lsSet(LS.notes, all.slice(-100)); renderAlleyLists();
  ['noteLane','noteOil','noteAdj'].forEach(id=>document.getElementById(id).value=''); setStatus('Saving\u2026');
  try { await api('/api/pattern-notes', {method:'POST', body:JSON.stringify(e)}); setStatus('Saved','ok'); } catch(err) { setStatus('Offline (saved on this phone)','off'); }
}
async function syncAlley() {
  try {
    const sv = await api('/api/surface-log?ballId='+encodeURIComponent(selectedBall.id));
    const all = lsGet(LS.surface);
    sv.forEach(s=>{ if (!all.some(x=>x.ballId===s.ballId && x.date===s.date && x.finish===s.finish)) all.push({ballId:s.ballId,date:s.date,finish:s.finish}); });
    all.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); lsSet(LS.surface, all.slice(-200));
    const nv = await api('/api/pattern-notes'); const notes = lsGet(LS.notes);
    nv.slice().reverse().forEach(n=>{ if (!notes.some(x=>x.lane===n.lane && x.oil===n.oil && x.adjustment===n.adjustment)) notes.unshift({lane:n.lane,oil:n.oil,adjustment:n.adjustment}); });
    lsSet(LS.notes, notes.slice(-100)); renderAlleyLists();
  } catch(e) {}
}
function initPersistence() {
  document.getElementById('saveLine').onclick = saveLine;
  document.getElementById('logFinish').onclick = logFinish;
  document.getElementById('saveNote').onclick = saveNote;
  renderSavedLines(); renderAlleyLists(); syncLines(); syncAlley();
}
init();
</script>
