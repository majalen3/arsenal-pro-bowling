<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urbanek Honey Badgers — Arsenal Pro</title>
<style>
  :root { --bg:#070b14; --card:#121826; --gold:#DAAF37; --green:#0F4D34; --lane:#143d28; --text:#eef4ff; --muted:#9bb0d0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
  header { background:linear-gradient(90deg,#0F4D34 0%,#0a1528 100%); padding:0.75rem 1.2rem; border-bottom:2px solid var(--gold); display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:1.35rem; color:var(--gold); font-weight:800; letter-spacing:0.5px; }
  .slogan { font-size:0.65rem; color:var(--gold); opacity:0.9; margin-top:2px; }
  .container { display:flex; flex:1; overflow:hidden; }
  .sidebar { width:300px; background:var(--card); border-right:1px solid #1f2a40; overflow-y:auto; padding:0.75rem; }
  .sidebar h2 { font-size:0.95rem; color:var(--gold); margin-bottom:0.5rem; font-weight:700; }
  .ball-card { background:#1a2236; border:1px solid #2a3550; border-radius:10px; padding:0.5rem 0.6rem; margin-bottom:0.4rem; cursor:pointer; display:flex; align-items:center; gap:0.6rem; position:relative; transition:border 0.15s; }
  .ball-card.active { border-color:var(--gold); background:#222c45; }
  .ball-dot { width:38px; height:38px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:0.6rem; font-weight:800; color:#000; }
  .ball-card .name { font-weight:600; font-size:0.88rem; }
  .ball-card .meta { font-size:0.62rem; color:var(--muted); }
  .info-btn { position:absolute; right:6px; top:6px; background:#2a3550; color:var(--gold); border:none; border-radius:4px; padding:1px 5px; font-size:0.65rem; cursor:pointer; }
  .main { flex:1; display:flex; flex-direction:column; padding:0.7rem; }
  .controls { display:flex; gap:0.5rem; flex-wrap:wrap; background:var(--card); padding:0.7rem; border-radius:10px; margin-bottom:0.5rem; border:1px solid #1f2a40; }
  .control-group { display:flex; flex-direction:column; min-width:95px; flex:1; }
  .control-group label { font-size:0.62rem; color:var(--muted); margin-bottom:2px; }
  input, select { background:#0d1320; border:1px solid #2a3550; color:var(--text); padding:0.28rem; border-radius:5px; font-size:0.82rem; }
  button { background:var(--gold); color:#000; border:none; padding:0.38rem 0.75rem; border-radius:6px; font-weight:700; cursor:pointer; font-size:0.82rem; }
  button.secondary { background:#2a3550; color:var(--text); }
  .canvas-wrap { flex:1; background:#0d1320; border-radius:10px; display:flex; align-items:center; justify-content:center; min-height:520px; position:relative; border:1px solid #1f2a40; }
  canvas { max-width:100%; max-height:100%; background:var(--lane); border-radius:6px; }
  .info-panel { background:var(--card); margin-top:0.5rem; padding:0.7rem; border-radius:10px; font-size:0.8rem; line-height:1.45; border:1px solid #1f2a40; }
  .strike-banner { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:var(--gold); color:#000; font-weight:800; padding:0.35rem 1.1rem; border-radius:20px; font-size:1rem; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.5); }
  .strike-banner.show { display:block; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:100; align-items:center; justify-content:center; padding:1rem; }
  .modal.open { display:flex; }
  .modal-content { background:var(--card); border:1px solid var(--gold); border-radius:14px; width:min(680px,95vw); max-height:90vh; overflow-y:auto; padding:1.4rem; }
  .modal-content h2 { color:var(--gold); margin-bottom:0.4rem; }
  .modal-content .close { float:right; cursor:pointer; font-size:1.6rem; line-height:1; }
  .spec-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin:0.8rem 0; }
  .spec-item { background:#1a2236; padding:0.5rem; border-radius:6px; font-size:0.85rem; }
  .recommendation { background:#142a22; border-left:3px solid var(--gold); padding:0.8rem; margin-top:0.8rem; border-radius:6px; }
  .links a { color:var(--gold); }
  @media (max-width:900px) { .container{flex-direction:column;} .sidebar{width:100%; max-height:200px;} .canvas-wrap{min-height:480px;} }
</style>
</head>
<body>
<header>
  <div><h1>URBANEK HONEY BADGERS</h1><div class="slogan">Fearless. Relentless. Always Hunting Strikes.</div></div>
  <div style="font-size:0.75rem;background:#000;padding:0.3rem 0.7rem;border-radius:16px;border:1px solid var(--gold);">Arsenal Pro</div>
</header>
<div class="container">
  <aside class="sidebar">
    <h2>Arsenal</h2>
    <div id="ballList"></div>
  </aside>
  <main class="main">
    <div class="controls">
      <div class="control-group"><label>Speed</label><input type="range" id="speed" min="12" max="22" value="15" step="0.5"><span id="speedVal">15</span></div>
      <div class="control-group"><label>Rev</label><input type="range" id="rev" min="100" max="500" value="220" step="10"><span id="revVal">220</span></div>
      <div class="control-group"><label>Release Board</label><input type="range" id="release" min="1" max="35" value="15" step="1"><span id="releaseVal">15</span></div>
      <div class="control-group"><label>Aim °</label><input type="range" id="aim" min="-10" max="10" value="0" step="0.5"><span id="aimVal">0</span></div>
      <div class="control-group"><label>Oil</label><input type="range" id="oil" min="0.5" max="1.6" value="1" step="0.1"><span id="oilVal">1.0</span></div>
      <div class="control-group"><label>Finish</label>
        <select id="finish">
          <option value="factory">Factory</option>
          <option value="500">500 grit</option>
          <option value="1000">1000 grit</option>
          <option value="2000">2000 grit</option>
          <option value="3000">3000 grit</option>
          <option value="polished">Polished</option>
        </select>
      </div>
      <div class="control-group"><label>Pattern</label>
        <select id="pattern"><option value="house">House</option><option value="sport">Sport</option><option value="cheetah">Cheetah</option><option value="scorpion">Scorpion</option><option value="shark">Shark</option><option value="dry">Dry</option></select>
      </div>
      <button id="simulate">Simulate</button>
      <button class="secondary" id="recommend">Recommended</button>
    </div>
    <div class="canvas-wrap">
      <div class="strike-banner" id="strikeBanner">STRIKE</div>
      <canvas id="lane" width="420" height="720"></canvas>
    </div>
    <div class="info-panel" id="infoPanel">Entry board and angle now shown. Strike pocket is boards 17-20.</div>
  </main>
</div>

<div class="modal" id="dossierModal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div id="dossierContent"></div>
  </div>
</div>

<script>
const balls = [
  {id:'rattler-big-bite', brand:'Radical', name:'Rattler Big Bite', color:'#DAAF37', rg:2.480, diff:0.035, cover:'Hybrid Reactive', coverName:'S.H.A.R.P. Hybrid', core:'Symmetric', coreName:'Rattler', finish:'500/1500/3000 Siaair', year:2024, motion:'Stronger mid-lane read with continuous motion and enough backend for the pocket.', rec:'YOUR PRIMARY HOUSE-SHOT BENCHMARK. Controllable midlane read with enough backend for typical league conditions. First ball out of the bag for most house shots.', when:'Fresh to medium house. When you want predictable midlane control.', whenNot:'Very dry or broken-down lanes where it becomes too early.', link:'https://www.bowwwl.com/bowling-balls/radical-rattler-big-bite'},
  {id:'deadly-rattler', brand:'Radical', name:'Deadly Rattler', color:'#00d4ff', rg:2.480, diff:0.035, cover:'Pearl Reactive', coverName:'HK22 HyperKinetic Pearl', core:'Symmetric', coreName:'Rattler', finish:'500/1000/1500 Crown', year:2023, motion:'Cleaner through the fronts, sharper continuous downlane motion.', rec:'YOUR TRANSITION BALL. Cleaner projection and sharper backend while retaining control. Perfect second ball after Big Bite when the lanes open.', when:'Medium to light oil, or after the pattern starts to break down.', whenNot:'Fresh heavy oil where you need earlier traction.', link:'https://www.bowwwl.com/bowling-balls/radical-deadly-rattler'},
  {id:'super-nova', brand:'Storm', name:'Super Nova', color:'#ff6b35', rg:2.490, diff:0.052, cover:'Solid Reactive', coverName:'NeX Solid', core:'Asymmetric', coreName:'Ignition', finish:'2000 Abralon', year:2022, motion:'Very early reading, strong midlane, high flare potential.', rec:'Heavy oil or when you need early traction and control. Use on fresh house when the pattern is long or volume is high.', when:'Fresh heavy house or long sport patterns.', whenNot:'Medium or light oil — it will read too early and burn up.', link:'https://www.bowwwl.com/bowling-balls/storm-super-nova'},
  {id:'hy-road', brand:'Storm', name:'Original Hy-Road', color:'#4ade80', rg:2.570, diff:0.046, cover:'Hybrid Reactive', coverName:'R2S Hybrid', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500-grit Polished', year:2008, motion:'Classic benchmark length with strong backend.', rec:'Excellent all-around for your style. Reliable on medium house and many tournament conditions.', when:'Medium house, standard tournament patterns.', whenNot:'Very heavy oil where you need more early traction.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road'},
  {id:'hy-road-pearl', brand:'Storm', name:'Hy-Road Pearl', color:'#a78bfa', rg:2.570, diff:0.046, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Symmetric', coreName:'Inverted Fe2', finish:'1500 Polished', year:2010, motion:'Clean through the fronts, strong angular backend.', rec:'Ideal transition or lighter oil. Play more direct angles.', when:'Medium-light oil, broken-down house, angle play.', whenNot:'Fresh heavy oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-pearl'},
  {id:'hy-road-solid', brand:'Storm', name:'Hy-Road Solid', color:'#22d3ee', rg:2.570, diff:0.046, cover:'Solid Reactive', coverName:'R2S Solid', core:'Symmetric', coreName:'Inverted Fe2', finish:'2000 Abralon', year:2014, motion:'Earlier than original Hy-Road with controlled midlane.', rec:'Stronger than the pearl versions. Use when you need more traction on fresher oil.', when:'Fresh to medium house when the pearl versions are too clean.', whenNot:'Light oil.', link:'https://www.bowwwl.com/bowling-balls/storm-hy-road-solid'},
  {id:'astrophysix', brand:'Storm', name:'AstroPhysiX', color:'#f472b6', rg:2.480, diff:0.053, cover:'Pearl Reactive', coverName:'R2S Pearl', core:'Asymmetric', coreName:'Atomic', finish:'1500 Polished', year:2019, motion:'Low RG pearl with strong flare — length then sharp backend.', rec:'Power pearl for angle and entry. Good when you want length plus strong finish.', when:'Medium oil when you need length and angle.', whenNot:'Heavy oil or when you need early control.', link:'https://www.bowwwl.com/bowling-balls/storm-astrophysix'},
  {id:'ice-storm', brand:'Storm', name:'Ice Storm', color:'#67e8f9', rg:2.550, diff:0.040, cover:'Pearl Reactive', core:'Symmetric', finish:'Polished', year:2015, motion:'Cleaner, more controllable pearl motion.', rec:'Use for dry lanes or when stronger pearls over-react.', when:'Dry or broken-down lanes.', whenNot:'Fresh oil.'},
  {id:'innovator', brand:'Radical', name:'Innovator', color:'#fb7185', rg:2.470, diff:0.050, cover:'Solid Reactive', core:'Asymmetric', year:2020, motion:'Strong early-to-mid reading solid.', rec:'Heavy oil / fresh solid for control.', when:'Fresh heavy conditions.', whenNot:'Medium or light oil.'},
  {id:'bigfoot-hybrid', brand:'Radical', name:'Bigfoot Hybrid', color:'#fbbf24', rg:2.468, diff:0.053, cover:'Hybrid Reactive', coverName:'HK22 Hybrid', core:'Symmetric', coreName:'Bigfoot', year:2022, motion:'Strong hybrid with continuous motion.', rec:'Benchmark hybrid strength for medium-heavy.', when:'Medium-heavy house or sport.', whenNot:'Light oil.'},
  {id:'rattler', brand:'Radical', name:'Rattler', color:'#86efac', rg:2.480, diff:0.035, cover:'Solid Reactive', coverName:'S.H.A.R.P', core:'Symmetric', coreName:'Rattler', finish:'500/1500/4000', year:2023, motion:'Benchmark symmetric solid — continuous and controllable.', rec:'Reliable control piece.', when:'When you want smooth, controllable motion.', whenNot:'When you need more angularity.'},
  {id:'ordnance-c4', brand:'900 Global', name:'Ordnance C4', color:'#c084fc', rg:2.490, diff:0.041, cover:'Hybrid Reactive', coverName:'S70 Hybrid', core:'Symmetric', coreName:'Shrapnel 2.0', finish:'4000 Abralon', year:2020, motion:'Clean hybrid with predictable shape.', rec:'Versatile medium-oil hybrid.', when:'Medium conditions.', whenNot:'Extremes of oil volume.'},
  {id:'raw-hammer', brand:'Hammer', name:'Raw Hammer Black', color:'#94a3b8', rg:2.540, diff:0.038, cover:'Solid Reactive', core:'Symmetric', year:2021, motion:'Controlled solid with good traction.', rec:'Benchmark solid for house shot.', when:'Standard house conditions.', whenNot:'Very light oil.'},
  {id:'rack-attack', brand:'Sports Tec', name:'Rack Attack Pro Line Urethane', color:'#f97316', rg:2.600, diff:0.015, cover:'Urethane', core:'Symmetric', year:2020, motion:'Classic urethane — smooth, early roll, controllable.', rec:'Short patterns, dry lanes, or maximum control and blending.', when:'Short patterns, dry lanes, or when reactive balls are too sharp.', whenNot:'Heavy oil or when you need strong backend.'}
];

let selectedBall = balls[0];
let canvas, ctx;

function getFinishMod(finish) {
  if (finish === '500') return { early: 1.25, hook: 1.15 };
  if (finish === '1000') return { early: 1.12, hook: 1.08 };
  if (finish === '2000') return { early: 1.0, hook: 1.0 };
  if (finish === '3000') return { early: 0.88, hook: 0.95 };
  if (finish === 'polished') return { early: 0.72, hook: 0.88 };
  return { early: 1.0, hook: 1.0 };
}

function getCoverMod(cover) {
  if (cover.includes('Solid')) return { early: 0.75, hook: 1.15 };
  if (cover.includes('Pearl')) return { early: 0.30, hook: 0.95 };
  if (cover.includes('Hybrid')) return { early: 0.52, hook: 1.05 };
  if (cover.includes('Urethane')) return { early: 0.85, hook: 0.65 };
  return { early: 0.5, hook: 1.0 };
}

function openDossier(ball) {
  const content = `
    <h2>${ball.brand} ${ball.name}</h2>
    <div style="color:var(--muted);font-size:0.85rem;margin-bottom:0.6rem;">${ball.year || ''} • ${ball.cover}${ball.coverName ? ' ('+ball.coverName+')' : ''}</div>
    <div class="spec-grid">
      <div class="spec-item"><strong>RG</strong><br>${ball.rg}</div>
      <div class="spec-item"><strong>Diff</strong><br>${ball.diff}</div>
      <div class="spec-item"><strong>Core</strong><br>${ball.core}${ball.coreName ? ' • '+ball.coreName : ''}</div>
      <div class="spec-item"><strong>Factory Finish</strong><br>${ball.finish || '—'}</div>
    </div>
    <p style="margin:0.6rem 0;"><strong>Motion:</strong> ${ball.motion}</p>
    <div class="recommendation">
      <strong>Recommendation for ~15 mph / ~220 RPM</strong><br>
      ${ball.rec}<br><br>
      <strong>When to use:</strong> ${ball.when}<br>
      <strong>When to leave it in the bag:</strong> ${ball.whenNot}
    </div>
    ${ball.link ? `<div class="links"><a href="${ball.link}" target="_blank">View on bowwwl.com →</a></div>` : ''}
  `;
  document.getElementById('dossierContent').innerHTML = content;
  document.getElementById('dossierModal').classList.add('open');
}

function init() {
  const list = document.getElementById('ballList');
  balls.forEach(b => {
    const card = document.createElement('div');
    card.className = 'ball-card' + (b.id === selectedBall.id ? ' active' : '');
    card.innerHTML = `<div class="ball-dot" style="background:${b.color}">${b.brand[0]}</div><div><div class="name">${b.name}</div><div class="meta">${b.cover.split(' ')[0]} • RG ${b.rg}</div></div><button class="info-btn">Info</button>`;
    card.onclick = (e) => {
      if (e.target.classList.contains('info-btn')) return;
      selectedBall = b;
      document.querySelectorAll('.ball-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      drawLane();
    };
    card.querySelector('.info-btn').onclick = (e) => { e.stopPropagation(); openDossier(b); };
    card.querySelector('.name').onclick = (e) => { e.stopPropagation(); openDossier(b); };
    list.appendChild(card);
  });

  ['speed','rev','release','aim','oil'].forEach(id => {
    document.getElementById(id).oninput = e => document.getElementById(id+'Val').textContent = e.target.value;
  });
  document.getElementById('finish').onchange = drawLane;
  document.getElementById('pattern').onchange = drawLane;
  document.getElementById('simulate').onclick = drawLane;
  document.getElementById('recommend').onclick = () => {
    const p = document.getElementById('pattern').value;
    const cover = getCoverMod(selectedBall.cover);
    let rel = cover.early > 0.6 ? 12 : 16;
    if (p === 'cheetah' || p === 'dry') rel = 18;
    if (p === 'shark') rel = 10;
    document.getElementById('release').value = rel;
    document.getElementById('releaseVal').textContent = rel;
    drawLane();
  };
  document.querySelector('.close').onclick = () => document.getElementById('dossierModal').classList.remove('open');
  document.getElementById('dossierModal').onclick = e => { if (e.target.id === 'dossierModal') e.target.classList.remove('open'); };

  canvas = document.getElementById('lane');
  ctx = canvas.getContext('2d');
  drawLane();
}

function simulatePath(ball) {
  const speed = +document.getElementById('speed').value;
  const rev = +document.getElementById('rev').value;
  const release = +document.getElementById('release').value;
  const aim = +document.getElementById('aim').value;
  const oil = +document.getElementById('oil').value;
  const finish = document.getElementById('finish').value;
  const pattern = document.getElementById('pattern').value;
  const w = canvas.width, h = canvas.height;

  const cover = getCoverMod(ball.cover);
  const fin = getFinishMod(finish);
  const rgEarly = Math.max(0.2, Math.min(0.9, (2.60 - ball.rg) * 2.2));
  const diffHook = 0.7 + (ball.diff * 12);
  const asymBoost = ball.core === 'Asymmetric' ? 1.12 : 1.0;

  const early = (cover.early * 0.5 + rgEarly * 0.35 + fin.early * 0.15) * fin.early;
  const hookPotential = cover.hook * diffHook * asymBoost * fin.hook;

  const revRatio = rev / (speed * 14);
  const baseHook = hookPotential * (0.55 + revRatio * 0.45) / oil;

  const startX = 40 + (release / 39) * (w - 80);
  let x = startX, y = 40;
  let vx = Math.sin(aim * Math.PI / 180) * 1.2;
  let vy = 4.8;
  const points = [];
  let breakpoint = null;

  for (let t = 0; t < 200; t++) {
    points.push({x, y});
    const board = ((x - 40) / (w - 80)) * 39;
    let fr = 0.35;
    if (pattern === 'house') fr = (board < 10 || board > 29) ? 1.4 : (board > 16 && board < 23 ? 0.28 : 0.7);
    else if (pattern === 'cheetah') fr = 1.5;
    else if (pattern === 'dry') fr = 1.7;
    else if (pattern === 'shark') fr = 0.5;
    else fr = 0.68;
    fr *= oil;

    const prog = (y - 40) / (h - 130);
    const phaseStart = 0.38 - early * 0.22;
    let phaseStrength = 0;
    if (prog > phaseStart) {
      const p = (prog - phaseStart) / (1 - phaseStart);
      phaseStrength = Math.sin(Math.min(p, 1) * Math.PI * 0.85) * (0.4 + p * 0.6);
    }
    const force = baseHook * fr * phaseStrength * 0.22 * (board < 19.5 ? 1 : -0.3);
    vx += force * 0.11;
    if (prog > 0.75) vx *= 0.985;
    x += vx; y += vy;

    if (!breakpoint && phaseStrength > 0.25 && Math.abs(force) > 0.06) breakpoint = {x, y, board};
    if (y > h - 85) break;
  }
  return {points, breakpoint};
}

function drawPins(w, h) {
  const baseY = h - 70;
  const spacing = 16;
  const centerX = 40 + (20 / 39) * (w - 80);
  const pins = [
    {n:1, x:centerX, y:baseY - spacing*3},
    {n:2, x:centerX - spacing*0.9, y:baseY - spacing*2},
    {n:3, x:centerX + spacing*0.9, y:baseY - spacing*2},
    {n:4, x:centerX - spacing*1.8, y:baseY - spacing},
    {n:5, x:centerX, y:baseY - spacing},
    {n:6, x:centerX + spacing*1.8, y:baseY - spacing},
    {n:7, x:centerX - spacing*2.7, y:baseY},
    {n:8, x:centerX - spacing*0.9, y:baseY},
    {n:9, x:centerX + spacing*0.9, y:baseY},
    {n:10, x:centerX + spacing*2.7, y:baseY}
  ];
  pins.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 6.5, 0, Math.PI*2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.fillStyle = '#000';
    ctx.font = '7px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(p.n, p.x, p.y + 2.5);
  });
  ctx.strokeStyle = 'rgba(218,175,55,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(centerX + 10, baseY - spacing*2.1, 18, 0, Math.PI*2);
  ctx.stroke();
}

function drawLane() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle = '#143d28';
  ctx.fillRect(40, 40, w-80, h-110);

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.font = '8px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 39; i++) {
    const x = 40 + (i/39)*(w-80);
    ctx.beginPath(); ctx.moveTo(x,40); ctx.lineTo(x,h-70); ctx.stroke();
    if (i % 5 === 0) ctx.fillText(i, x, h-55);
  }

  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(40, h*0.38, w-80, 4);
  ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('ARROWS', 48, h*0.38 - 5);

  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(40,40); ctx.lineTo(w-40,40); ctx.stroke();

  drawPins(w, h);

  const result = simulatePath(selectedBall);
  const points = result.points;

  ctx.beginPath();
  ctx.strokeStyle = selectedBall.color;
  ctx.lineWidth = 3.5;
  points.forEach((p,i) => i===0 ? ctx.moveTo(p.x,p.y) : ctx.lineTo(p.x,p.y));
  ctx.stroke();

  if (result.breakpoint) {
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath();
    ctx.arc(result.breakpoint.x, result.breakpoint.y, 4.5, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('BP', result.breakpoint.x, result.breakpoint.y - 7);
  }

  if (points.length) {
    const last = points[points.length-1];
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(last.x, last.y, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = selectedBall.color; ctx.stroke();
  }

  const endBoard = points.length ? (((points.at(-1).x - 40) / (w-80)) * 39) : null;
  let pocketCall = '—';
  let isStrike = false;
  if (endBoard !== null) {
    if (endBoard >= 17.5 && endBoard <= 19.5) { pocketCall = 'FLUSH'; isStrike = true; }
    else if (endBoard >= 16.5 && endBoard < 17.5) { pocketCall = 'LIGHT'; isStrike = true; }
    else if (endBoard > 19.5 && endBoard <= 20.8) { pocketCall = 'HIGH'; isStrike = true; }
    else if (endBoard < 16.5) pocketCall = 'LIGHT MISS';
    else pocketCall = 'HIGH MISS';
  }

  document.getElementById('strikeBanner').classList.toggle('show', isStrike);
  document.getElementById('strikeBanner').textContent = isStrike ? pocketCall : 'STRIKE';

  // Entry angle (degrees from straight)
  let entryAngle = null;
  if (points.length > 5) {
    const last = points[points.length-1];
    const prev = points[points.length-4];
    const dx = last.x - prev.x;
    const dy = last.y - prev.y;
    entryAngle = Math.abs(Math.atan2(dx, dy) * 180 / Math.PI);
  }

  const finish = document.getElementById('finish').value;
  document.getElementById('infoPanel').innerHTML = `
    <strong>${selectedBall.brand} ${selectedBall.name}</strong> — Factory: ${selectedBall.finish || '—'}<br>
    Finish: <strong>${finish === 'factory' ? 'Factory' : finish}</strong> • Entry board: <strong>${endBoard ? endBoard.toFixed(1) : '—'}</strong> • Entry angle: <strong>${entryAngle ? entryAngle.toFixed(1) : '—'}°</strong><br>
    Pocket: <strong style="color:#DAAF37">${pocketCall}</strong><br>
    <span style="font-size:0.75rem;color:#9bb0d0">Strike pocket ≈ boards 17–20. Ideal entry angle typically 4–6° for good carry. Flush is ~18.5 board.</span>
  `;
}

init();
</script>
</body>
</html>
